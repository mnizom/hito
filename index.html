<style>
/* Layout: one phone-width column — glass header, scrolling cards, floating tab bar with a raised + button. */
:root{
  --bg:#f6f4f7; --surface:#ffffff; --surface-2:#f1eef3; --ink:#1f1b24; --ink-2:#6f6878; --hair:#e7e2ea;
  --a:#e2457f; --a-soft:#fdecf3; --b:#1fa9b8; --b-soft:#e3f6f8; --accent:#ef8a1f; --accent-soft:#fff1e2; --hl:#f2c230;
  --shadow:0 1px 2px rgba(31,27,36,.04),0 8px 24px rgba(31,27,36,.06);
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --voice:"Gowun Batang","AppleMyungjo","Noto Serif KR",serif;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121014; --surface:#1c1a20; --surface-2:#26232b; --ink:#f1edf4; --ink-2:#a59eae; --hair:#2f2b35;
  --a:#ff6b9d; --a-soft:#3a1f2c; --b:#3fcbd8; --b-soft:#12313a; --accent:#ffa043; --accent-soft:#3a2a17; --hl:#f5d05a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121014; --surface:#1c1a20; --surface-2:#26232b; --ink:#f1edf4; --ink-2:#a59eae; --hair:#2f2b35;
  --a:#ff6b9d; --a-soft:#3a1f2c; --b:#3fcbd8; --b-soft:#12313a; --accent:#ffa043; --accent-soft:#3a2a17; --hl:#f5d05a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{max-width:460px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
.top{display:flex;align-items:center;gap:10px;padding-block:14px 10px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.top h1{margin:0;font-size:17px;font-weight:600;flex:1;min-width:0;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.top h1 .pair{display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-variant-numeric:tabular-nums;flex:none}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--surface);box-shadow:var(--shadow);flex:none}
.hearts{display:flex;align-items:center;gap:4px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:5px 11px;border-radius:999px;font-size:14px;font-variant-numeric:tabular-nums;flex:none}
.hearts svg{width:15px;height:15px;fill:currentColor;stroke:none}

main{flex:1;overflow-y:auto;padding-block:6px 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
/* 떠 있는 탭 박스 + 아이폰 홈 바만큼 끝에 빈칸 (스크롤 칸의 padding-bottom 은 사파리가 무시할 때가 있다) */
main::after{content:"";flex:none;height:calc(84px + env(safe-area-inset-bottom,0px))}

nav.tabs{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:64px;padding:0 6px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--hair);border-radius:24px;box-shadow:var(--shadow);z-index:5}
nav.tabs button{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-2);border-radius:16px;font-size:10.5px;font-weight:500}
nav.tabs button[aria-current="true"]{color:var(--a)}
nav.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.muted{color:var(--ink-2)} .small{font-size:13px}
h2{margin:0;font-family:var(--voice);font-size:24px;font-weight:700;line-height:1.3;text-wrap:balance}
h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--ink-2)}
.who-a{color:var(--a)} .who-b{color:var(--b)}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:600;color:#fff;flex:none}
.av.a{background:var(--a)} .av.b{background:var(--b)}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px}
.voice{font-family:var(--voice);font-size:18px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}

/* media */
.media{aspect-ratio:1;max-width:100%;border-radius:var(--r-md);overflow:hidden;background:var(--surface-2);position:relative}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;color:var(--ink)}
.ph.a{background:linear-gradient(150deg,var(--a-soft),var(--surface-2))}
.ph.b{background:linear-gradient(150deg,var(--b-soft),var(--surface-2))}
.ph svg{width:34%;height:34%;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;opacity:.35}

/* widget */
.widget{display:flex;gap:14px;align-items:center;padding:12px;border-radius:var(--r-lg);text-align:left;width:100%;background:var(--b-soft)}
.widget.a{background:var(--a-soft)}
.widget .media{width:68px;border-radius:12px;flex:none}
.widget .txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.widget .lbl{font-size:12px;font-weight:600;letter-spacing:.04em}
.widget .voice{font-size:16px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* posts */
.post{display:flex;flex-direction:column;gap:12px}
.post .head{display:flex;align-items:center;gap:8px;font-size:13px}
.post .head b{font-weight:600}
.post .head time{color:var(--ink-2);font-variant-numeric:tabular-nums;margin-left:auto}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.mood{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:4px 10px 4px 8px;font-variant-numeric:tabular-nums}
.mood .m{width:28px;height:4px;border-radius:2px;background:var(--hair);overflow:hidden}
.mood .m i{display:block;height:100%;background:var(--ink-2)}
.mood.love .m i{background:var(--a)}
.secret{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:var(--r-md);background:var(--a-soft)}
.secret.b{background:var(--b-soft)}
.secret.locked{flex-direction:row;align-items:center;gap:10px;background:var(--surface-2);color:var(--ink-2);font-size:13.5px}
.secret .voice{font-size:16px}
.secret-card{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--a-soft),var(--shadow)}
.reply{align-self:flex-end;max-width:85%;padding:8px 14px;border-radius:16px 16px 4px 16px;font-family:var(--voice);font-size:16px;overflow-wrap:anywhere}
.reply.a{background:var(--a-soft)} .reply.b{background:var(--b-soft)}
.actions{display:flex;gap:8px;align-items:center}
.like{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);background:var(--surface-2);flex:none}
.like svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7}
.like.on{color:var(--accent);background:var(--accent-soft)} .like.on svg{fill:currentColor}
.inline{flex:1;min-width:0;display:flex;align-items:center;background:var(--surface-2);border-radius:999px;padding:3px 3px 3px 14px}
.inline input{flex:1;min-width:0;border:0;background:none;padding:6px 0;font-size:14px}
.inline input:focus{outline:none}
.inline:focus-within{box-shadow:0 0 0 2px var(--accent)}
.send{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--surface);flex:none}
.send svg{width:16px;height:16px}
.textbtn{font-size:13px;color:var(--ink-2);padding:6px 4px}
.textbtn.danger{color:var(--a);font-weight:600}

/* forms */
.field{display:flex;flex-direction:column;gap:8px}
.lab{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--ink-2)}
input[type=text],input[type=date],textarea{width:100%;padding:12px 14px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-md);transition:border-color .15s}
input[type=text]:focus,input[type=date]:focus,textarea:focus{outline:none;border-color:var(--ink-2)}
textarea{min-height:96px;resize:vertical;font-family:var(--voice);font-size:17px;line-height:1.55}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 20px;border-radius:var(--r-md);font-weight:600;font-size:15px;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--surface)}
.btn.accent{background:var(--accent);color:#fff}
.btn.sm{height:36px;padding:0 14px;font-size:13.5px;border-radius:12px}
.btn.block{width:100%}
.slider{display:grid;grid-template-columns:88px 1fr 34px;gap:12px;align-items:center;font-size:13.5px}
.slider output{font-variant-numeric:tabular-nums;font-size:13px;text-align:right;color:var(--ink-2)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:linear-gradient(to right,var(--tc) var(--v),var(--hair) var(--v));--tc:var(--ink-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--surface);border:2px solid var(--tc);box-shadow:var(--shadow)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--tc)}
.pick{display:grid;place-items:center;text-align:center;cursor:pointer;color:var(--ink-2);font-size:14px;gap:6px;border:1.5px dashed var(--hair);background:var(--surface)}
.pick input{position:absolute;width:1px;height:1px;opacity:0}
.pick:focus-within{border-color:var(--accent)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:9px;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.toggle{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--a)}

/* questions */
.keybar{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-md);background:var(--accent-soft);font-size:13px}
.keybar b{font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums}
.qlist{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column}
.qlist li+li{border-top:1px solid var(--hair)}
.qlist button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:13px 10px;font-family:var(--voice);font-size:16.5px;border-radius:10px}
.qlist button:hover{background:var(--surface-2)}
.qlist .q{flex:1;min-width:0}
.dots{display:flex;gap:4px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--hair)}
.dot.a.on{background:var(--a)} .dot.b.on{background:var(--b)}
.ans{border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:10px;min-height:130px}
.ans.a{background:var(--a-soft)} .ans.b{background:var(--b-soft)}
.ans .who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.ans textarea{background:var(--surface);border-color:transparent}

/* diary */
.monthbar{display:flex;align-items:center;justify-content:space-between}
.monthbar .ym{font-family:var(--voice);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .wd{font-size:11px;font-weight:600;color:var(--ink-2);padding-bottom:6px}
.cal .wd:first-child{color:var(--a)}
.cal button{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-variant-numeric:tabular-nums;font-size:14px}
.cal button:hover{background:var(--surface-2)}
.cal button.today{background:var(--ink);color:var(--surface)}
.cal .n{padding:0 3px 1px;line-height:1.2}
.cal .n.sec{box-shadow:inset 0 -3px 0 var(--hl)}
.cal .ds{display:flex;gap:3px;height:5px}
.cal .ds i{width:5px;height:5px;border-radius:50%}
.cal .ds i.a{background:var(--a)} .cal .ds i.b{background:var(--b)}
.daytitle{font-family:var(--voice);font-size:28px;font-weight:700;letter-spacing:.14em;text-align:center;font-variant-numeric:tabular-nums}
.daysub{text-align:center;font-size:13px;color:var(--ink-2);margin-top:-10px}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{aspect-ratio:1;border-radius:12px;overflow:hidden;display:block;padding:0;position:relative;background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--c)}
.cell.a{--c:var(--a)} .cell.b{--c:var(--b)}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 2px var(--c);pointer-events:none}
.cell .t{position:absolute;inset:0;padding:10px;font-family:var(--voice);font-size:13px;line-height:1.4;text-align:left;overflow:hidden;color:var(--ink)}
.cell .lock{position:absolute;inset:0;display:grid;place-items:center;color:var(--c)}
.entries{display:flex;flex-direction:column;gap:8px}
.entry{border-radius:var(--r-md);padding:12px 14px 12px 16px;text-align:left;display:flex;gap:10px;align-items:flex-start;width:100%;position:relative;background:var(--surface);box-shadow:var(--shadow)}
.entry::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.entry.a{--c:var(--a)} .entry.b{--c:var(--b)}
.entry .voice{font-size:16px;flex:1;min-width:0}
article.entry{flex-direction:column;align-items:stretch;gap:8px;padding:14px 16px 12px 18px}
.entry .head{display:flex;align-items:center;gap:8px;font-size:13px}
.entry .head b{font-weight:600}
.entry .head time{margin-left:auto;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tag.hl{background:color-mix(in srgb,var(--hl) 28%,transparent);color:var(--ink)}
.mask{display:flex;flex-direction:column;gap:7px;padding:4px 0 2px}
.mask i{display:block;height:15px;border-radius:4px;background:var(--hl)}
.cell .ph svg{width:40%;height:40%}
.detail{display:grid;grid-template-columns:20px 1fr 20px;gap:8px;align-items:center}
.peek{height:46%;border-radius:6px;background:var(--c);opacity:.35}
.peek.a{--c:var(--a)} .peek.b{--c:var(--b)}
.peek:disabled{visibility:hidden}
.peek:hover{opacity:.6}

/* plans */
.list{list-style:none;margin:0;padding:4px 0;display:flex;flex-direction:column}
.list li{display:flex;gap:12px;align-items:center;padding:10px 4px}
.list li+li{border-top:1px solid var(--hair)}
.cal-chip{width:44px;flex:none;text-align:center;border-radius:10px;background:var(--surface-2);padding:4px 0;line-height:1.15}
.cal-chip small{display:block;font-size:10px;color:var(--ink-2);font-weight:600}
.cal-chip b{font-size:17px;font-variant-numeric:tabular-nums}
.list .ttl{flex:1;min-width:0;overflow-wrap:anywhere}
.tag{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;flex:none}
.tag.a{background:var(--a-soft);color:var(--a)} .tag.b{background:var(--b-soft);color:var(--b)} .tag.both{background:var(--accent-soft);color:var(--accent)}
.x{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);flex:none}
.x:hover{background:var(--surface-2)}
.x svg{width:15px;height:15px}
.proj{display:flex;flex-direction:column;gap:6px}
.proj .ph-row{display:flex;align-items:center;gap:8px}
.proj .name{font-weight:600;font-size:16px;flex:1;min-width:0}
.progress{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:2px}
.check{display:flex;gap:10px;align-items:center;text-align:left;padding:6px 0;font-size:14.5px}
.check .bx{width:20px;height:20px;border:1.5px solid var(--hair);border-radius:6px;flex:none;display:grid;place-items:center;color:#fff}
.check.done .bx{background:var(--accent);border-color:var(--accent)}
.check .bx svg{width:13px;height:13px;stroke-width:2.6}
.check.done span:last-child{text-decoration:line-through;color:var(--ink-2)}
.addrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.addrow input[type=text]{flex:1;min-width:140px}

.space-row .pair{flex:1;min-width:0;font-family:var(--ui);font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.space-row[aria-pressed="true"]{background:var(--surface-2)}
/* charts */
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:6px}
.bars{display:flex;flex-direction:column;gap:14px}
.bar{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;font-size:13px}
.bar .track{display:flex;flex-direction:column;gap:4px}
.bar .fill{height:8px;border-radius:4px;min-width:3px}
.bar .fill.a{background:var(--a)} .bar .fill.b{background:var(--b)}
.bar .fill.said{background:var(--ink-2);opacity:.45}
.ratio .bar{grid-template-columns:52px 1fr}
.ratio .track{flex-direction:row;align-items:center;gap:8px}
.ratio .fill{height:10px}
.ratio .num{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.ratio .big{display:flex;align-items:baseline;gap:4px}
.ratio .big b{font-family:var(--voice);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.ratio .big span{color:var(--ink-2)}
.empty{border-radius:var(--r-lg);padding:28px 20px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface);box-shadow:var(--shadow);font-size:14px}
.empty .big{font-family:var(--voice);font-size:19px;font-weight:700;color:var(--ink)}
.empty .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:30;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.welcome{display:flex;flex-direction:column;gap:18px;padding-top:24px}

<script>
// ---------- icons ----------
const ICON = {
  menu: '<path d="M4 7h16M4 12h16M4 17h10"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  heart: '<path d="M12 20s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 7.3 4.2 4.2 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/>',
  send: '<path d="M5 12h13M13 6l6 6-6 6"/>',
  lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="m11 12 8-8M16 7l2 2"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  check: '<path d="m5 12 4.5 4.5L19 7"/>',
  left: '<path d="M15 5l-7 7 7 7"/>', right: '<path d="m9 5 7 7-7 7"/>',
  image: '<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m4 18 5-5 4 4 3-3 4 4"/>',
  chart: '<path d="M4 19h16M7 15l4-5 3 3 5-6"/>', scale: '<path d="M12 4v16M5 8h14M7 8l-3 6a3 3 0 0 0 6 0zM17 8l-3 6a3 3 0 0 0 6 0z"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>',
  home: '<path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/>',
  pen: '<path d="M4 20h4L19 9l-4-4L4 16z"/>', sun: '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>',
  cloud: '<path d="M7 18a4 4 0 0 1-.5-8A5.5 5.5 0 0 1 17 8.5a4.5 4.5 0 0 1 0 9.5z"/>',
};
const svg = (n, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

// ---------- built-in content ----------
const DAILY_LIMIT = 6; // 하루에 올리는 상황 수. basic: 각자 6개 / pro: 각자 24개
const PLACEHOLDERS = ["cloud", "sun", "heart"];

// ---------- storage: shared db when available, this browser otherwise ----------
// mods = AI가 정리한 모듈러, aiq = AI가 한 사람에게 보낸 질문, asks = 내가 Claude에게 물은 것
const COLS = ["meta", "posts", "questions", "events", "projects", "mods", "aiq", "asks"];
const S = Object.fromEntries(COLS.map(c => [c, {}]));
let db = null, mode = "local";
function lsGet(k){ try { return localStorage.getItem(k) } catch { return null } }
function lsSet(k, v){ try { localStorage.setItem(k, v) } catch {} }
// 연결 = 두 사람이 함께 정한 6자리 코드. 한 사람이 코드를 만들고(a), 상대가 그 코드를 넣으면(b) 연결된다.
// 기록은 spaces/<코드>/<컬렉션> 아래에 쌓고, 연결 정보(이름·관계·누가 들어왔는지)는 spaces/<코드>에 둔다.
// 이 기기가 들어간 연결 목록과 각 연결에서 내가 a인지 b인지는 이 기기에만 저장한다.
let space = lsGet("hito.space");
let SP = {};
// 초대 링크(?join=코드)로 열렸으면 코드를 기억해 두고 주소에서는 지운다. 로그인을 거쳐도 남도록 저장한다
{ const q = new URLSearchParams(location.search), c = (q.get("join") || "").replace(/\D/g, "");
  if (c.length === 6) lsSet("hito.invite", c);
  if (q.has("join")) try { q.delete("join"); history.replaceState(null, "", location.pathname + (String(q) ? "?" + q : "") + location.hash) } catch {} }
const colPath = col => `spaces/${space}/${col}`;
const lsData = () => "hito.data." + space;
const lsMe = () => "hito.me." + space;
const joinedList = () => { try { return JSON.parse(lsGet("hito.joined") || "[]") } catch { return [] } };
function loadLocal(){
  try { const d = JSON.parse(lsGet(lsData()) || "{}"); COLS.forEach(c => S[c] = d[c] || {}) } catch {}
  try { SP = JSON.parse(lsGet("hito.spaces") || "{}") } catch {}
}
function saveLocal(){ if (mode === "local") lsSet(lsData(), JSON.stringify(S)) }

const chains = {};
// 저장 권한이 없으면(공개 링크로 들어온 외부 사람 등) 쓰기가 invalid_argument 로 거절된다
const noWrite = e => ["permission_denied", "not_granted", "invalid_argument"].includes(e?.code);
// 저장이 되면 true, 안 되면 false 로 끝나는 약속을 돌려준다
function queue(key, fn){
  const p = (chains[key] || Promise.resolve()).then(fn).then(() => true, e => {
    toast(noWrite(e) ? "저장 권한 없음 · 공유에서 편집자로 초대받아야 해요" : "저장 실패");
    return false;
  });
  chains[key] = p; return p;
}
function put(col, id, obj){
  S[col] = { ...S[col], [id]: obj }; saveLocal(); render();
  const path = colPath(col);
  if (db) queue(path + "/" + id, () => db.collection(path).doc(id).set(obj));
}
function del(col, id){
  const n = { ...S[col] }; delete n[id]; S[col] = n; saveLocal(); render();
  const path = colPath(col);
  if (db) queue(path + "/" + id, () => db.collection(path).doc(id).delete());
}
function putSpace(id, obj){
  const prev = SP[id];
  SP = { ...SP, [id]: obj }; if (mode === "local") lsSet("hito.spaces", JSON.stringify(SP)); render();
  if (!db) return Promise.resolve(true);
  // 저장이 거절되면 화면에 먼저 반영한 것을 되돌린다
  return queue("spaces/" + id, () => db.collection("spaces").doc(id).set(obj))
    .then(ok => { if (!ok){ SP = { ...SP }; if (prev) SP[id] = prev; else delete SP[id]; render(true) } return ok });
}
let unsubs = [];
function subscribeSpace(){
  unsubs.forEach(u => u()); unsubs = [];
  if (!space) return;
  unsubs = COLS.map(col => db.collection(colPath(col)).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = d.data() }); S[col] = m; render();
  }, () => toast("연결 끊김")));
}
function joinSpace(code, role){
  lsSet("hito.me." + code, role);
  lsSet("hito.joined", JSON.stringify([...new Set([...joinedList(), code])]));
  switchSpace(code);
}
// 6자리 숫자 코드. 이미 있는 코드와 겹치지 않게
function newCode(){
  for (;;){ const n = crypto.getRandomValues(new Uint32Array(1))[0] % 900000 + 100000; if (!SP[n]) return String(n) }
}
function switchSpace(id){
  space = id; lsSet("hito.space", id);
  COLS.forEach(c => S[c] = {});
  if (db) subscribeSpace(); else loadLocal();
  me = lsGet(lsMe());
  go("home");
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const all = col => Object.entries(S[col]).map(([id, v]) => ({ id, ...v }));

// 이 사람의 claude.ai 계정 id (다른 사람과 구분할 수 없는 불투명한 값). 없으면 null
let myId = null;
const myIdReady = (async () => {
  const u = window.claude?.use ? await window.claude.use("user").catch(() => null) : null;
  myId = u ? await u.id().catch(() => null) : null;
})();
async function connect(){
  window.claude?.use?.("sample").then(f => { ai = f; render() }, () => {});
  const c = window.claude?.use ? await window.claude.use("db").catch(() => null) : null;
  if (!c) return;
  db = c; mode = "shared";
  // 서버는 내가 들어간 연결만 돌려준다. 코드로 찾아 둔 남의 연결(아직 새로 연결 전)은 지우지 않고 덮어쓰기만 한다
  db.collection("spaces").onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = d.data() }); SP = { ...SP, ...m }; render();
  }, () => {});
  subscribeSpace();
}

// ---------- who am I ----------
let me = lsGet(lsMe()); // "a" | "b", 연결마다 따로
const other = w => w === "a" ? "b" : "a";
const couple = () => ({ names: { a: "Hana", b: "Sora" }, start: "", kind: "couple", ...(SP[space] || {}) });
// 각자 고르는 테마색. 연결 정보 colors.a / colors.b 에 저장하고 --a / --b 를 덮어쓴다
const COLORS = [["#e2457f", "핑크"], ["#e0503c", "빨강"], ["#8a5cf0", "보라"], ["#2f7fe0", "파랑"], ["#1fa9b8", "하늘"], ["#2a9d5c", "초록"]];
function applyColors(){
  const r = document.documentElement.style, c = SP[space]?.colors || {};
  ["a", "b"].forEach(w => {
    if (c[w]){ r.setProperty("--" + w, c[w]); r.setProperty("--" + w + "-soft", `color-mix(in srgb, ${c[w]} 14%, var(--bg))`) }
    else { r.removeProperty("--" + w); r.removeProperty("--" + w + "-soft") }
  });
}
const swatches = (sel, taken) => `<div class="swatches">${COLORS.map(([hex, label]) =>
  `<button data-color="${hex}" aria-label="${label}" aria-pressed="${sel === hex}" ${hex === taken ? "disabled" : ""} style="--c:${hex}"></button>`).join("")}</div>`;
// 상대가 아직 코드를 넣지 않았으면 true
const waiting = () => !!SP[space] && !SP[space].joined?.[other(me)];
const isFriend = () => couple().kind === "friend";
const loveWord = () => isFriend() ? "얼마나 아끼는지" : "얼마나 사랑하는지";
const startWord = () => isFriend() ? "친구 된 날" : "사귄 날";
const nameOf = w => couple().names[w] || (w === "a" ? "A" : "B");
const av = w => `<span class="av ${w}" aria-hidden="true">${esc([...nameOf(w)][0] || "")}</span>`;

// ---------- helpers ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}` };
const compact = s => s.slice(2).replace(/-/g, ""); // 2026-08-19 -> 260819
const WD = ["일", "월", "화", "수", "목", "금", "토"];
function dday(){
  const s = couple().start; if (!s) return "";
  const t = new Date(ymd(new Date())), st = new Date(s);
  return "D+" + (Math.floor((t - st) / 864e5) + 1);
}
function media(o, alt){
  if (o.photo) return `<img src="${o.photo}" alt="${alt || "올린 사진"}">`;
  const n = PLACEHOLDERS[[...String(o.id)].reduce((a, c) => a + c.charCodeAt(0), 0) % PLACEHOLDERS.length];
  return `<div class="ph ${o.who}" role="img" aria-label="기본 그림"><svg viewBox="0 0 24 24">${ICON[n]}</svg></div>`;
}
let toastT;
function toast(msg){
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.append(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}
// 폰 원본(수십 MB)을 data URL로 통째 읽으면 안드로이드에서 메모리가 터진다 → 비트맵으로 바로 줄인다
async function decode(file){
  if (window.createImageBitmap) try { return await createImageBitmap(file, { imageOrientation: "from-image" }) } catch {}
  const url = URL.createObjectURL(file);
  try { return await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = url }) }
  finally { setTimeout(() => URL.revokeObjectURL(url), 0) }
}
async function shrink(file, max = 640){
  const img = await decode(file), w = img.width, h = img.height;
  const k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); img.close?.();
  return c.toDataURL("image/jpeg", .72);
}
function armDelete(btn, onConfirm){
  if (btn.dataset.armed) return onConfirm();
  btn.dataset.armed = 1; btn.textContent = "한 번 더 누르면 지워져요"; btn.classList.add("danger");
}
const empty = (icon, big, text, action = "") => `<div class="empty"><span class="ic">${svg(icon)}</span><span class="big">${big}</span>${text ? `<span>${text}</span>` : ""}${action}</div>`;

// ---------- router ----------
let route = { name: "home" };
let draft = {}; // in-progress form values per screen
function go(name, params = {}){ route = { name, ...params }; draft = {}; render(true); document.getElementById("view").scrollTop = 0 }
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go);
});

let pending = false, claimed = null;
function render(force){
  const ae = document.activeElement;
  if (!force && ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && ae.type !== "range") { pending = true; return }
  pending = false;
  applyColors();
  if (space && me && myId && SP[space]?.joined?.[me] === true && claimed !== space){ claimed = space; putSpace(space, { ...SP[space], joined: { ...SP[space].joined, [me]: myId } }) }
  // 초대 링크로 들어왔으면 db가 준비된 뒤 그 코드를 찾는 화면으로 (이미 그 연결 안이면 그냥 둔다)
  const inv = lsGet("hito.invite");
  if (inv && (db || !window.claude?.use)){
    try { localStorage.removeItem("hito.invite") } catch {}
    if (inv !== space){ route = { name: space && me ? "pair" : "home", backTo: "home" }; draft = { pm: "join", code: inv, auto: true } }
  }
  // 연결이 없으면 어느 탭이든 홈(초대하기 / 코드 입력)으로
  if (!space || !me) route = { name: "home" };
  const v = VIEWS[route.name] || VIEWS.home;
  const out = v();
  renderTop(out.title, out.action);
  const view = document.getElementById("view");
  view.innerHTML = out.html;
  out.bind?.(view);
  const tab = { day: "diary", entry: "diary" }[route.name] || route.name;
  document.querySelectorAll("#tabs [data-go]").forEach(b => b.setAttribute("aria-current", String(b.dataset.go === tab)));
}
document.addEventListener("focusout", () => setTimeout(() => { if (pending) render() }, 0));

function renderTop(title, action){
  const top = document.getElementById("top");
  const hearts = heartBalance();
  const left = route.name === "home"
    ? `<button class="iconbtn" data-menu aria-label="설정">${svg("gear")}</button>
       <h1 class="logo"><span class="hi">Hi</span><span class="to">To</span></h1>`
    : `<button class="iconbtn" data-back aria-label="뒤로">${svg("back")}</button><h1>${title || ""}</h1>`;
  top.innerHTML = `${left}${action ? `<button class="iconbtn" data-action aria-label="${action.label}">${svg(action.icon)}</button>` : ""}<span class="hearts" title="내 하트 점수"><svg viewBox="0 0 24 24">${ICON.heart}</svg>${hearts}</span>`;
  top.querySelector("[data-back]")?.addEventListener("click", () => go(route.backTo || "home", route.backParams || {}));
  top.querySelector("[data-menu]")?.addEventListener("click", () => go("settings"));

}

// 함께 설정
// 1) 초대하기: 관계를 고르고 코드를 만든다 (나 = a). 코드 입력: 상대가 만든 코드를 넣는다.
// 2) 코드를 넣으면: 내 계정이 이미 들어간 코드면 그 자리로 바로 들어가고, 아니면 빈자리가 있을 때만 "새로 연결"(나 = b).
//    자리 주인은 joined.a / joined.b 에 둔 계정 id 로 가린다 — 다른 계정은 남의 자리로 들어갈 수 없다.
// 3) 연결된 뒤 내 이름이 없으면 홈에서 이름·색을 정한다 (setupHTML).
const ownsSeat = (sp, w) => !!sp?.joined?.[w] && (sp.joined[w] === myId || (sp.joined[w] === true && !myId));
const mySeat = sp => ["a", "b"].find(w => ownsSeat(sp, w));
const segOf = (key, val, opts) => `<div class="seg">${opts.map(([k, l]) => `<button data-${key}="${k}" aria-pressed="${val === k}">${l}</button>`).join("")}</div>`;
function pairHTML(){
  draft.pm ??= "make"; draft.pk ??= "couple";
  const code = draft.found, sp = code && SP[code];
  // 코드를 넣었는데 내 자리가 없고 빈자리도 없으면 들어갈 수 없다. 빈자리가 있으면 새로 연결만
  if (sp) return { html: `<div class="welcome">
      ${sp.names?.a ? `<span class="muted">${esc(sp.names.a)}님의 초대</span>` : ""}
      <span class="pair-code" style="padding-top:0">${code.slice(0, 3)} ${code.slice(3)}</span>
      ${sp.joined?.b ? `<span class="muted">이미 연결된 코드</span>` : `<button class="btn primary" id="p-new">새로 연결</button>`}
      <button class="textbtn" id="p-back" style="align-self:flex-start">다른 코드</button></div>`,
    bind: v => {
      v.querySelector("#p-new")?.addEventListener("click", async () => {
        if (!await putSpace(code, { ...sp, joined: { ...sp.joined, b: myId || true } })) return;
        draft = {}; joinSpace(code, "b") });
      v.querySelector("#p-back").onclick = () => { draft = { pm: "join" }; render(true) };
    }};
  // 이 계정이 이미 들어가 있는 연결 (다른 기기에서 만든 것 포함)
  const mine = myId ? Object.keys(SP).filter(id => mySeat(SP[id])) : [];
  return { html: `<div class="welcome">
    ${mine.map(id => { const sp = SP[id], w = mySeat(sp);
      return `<button class="btn" data-enter="${id}" style="align-self:flex-start"><span style="color:${sp.colors?.a || "var(--a)"}">${esc(sp.names?.a || "")}</span>&nbsp;&amp;&nbsp;<span style="color:${sp.colors?.b || "var(--b)"}">${esc(sp.names?.b || "")}</span>&nbsp;들어가기</button>` }).join("")}
    ${segOf("pm", draft.pm, [["make", "초대하기"], ["join", "코드 입력"]])}
    ${draft.pm === "make" ? segOf("pk", draft.pk, KINDS)
      : `<input type="text" id="p-code" inputmode="numeric" maxlength="7" placeholder="코드" aria-label="코드" value="${esc(draft.code || "")}" style="font-size:24px;letter-spacing:.2em">`}
    <button class="btn primary" id="p-go">${draft.pm === "make" ? "코드 만들기" : "연결"}</button>
    ${logoutHTML()}</div>`,
  bind: v => {
    const keep = () => { const c = v.querySelector("#p-code"); if (c) draft.code = c.value };
    v.querySelectorAll("[data-pm]").forEach(b => b.onclick = () => { keep(); draft.pm = b.dataset.pm; render(true) });
    v.querySelectorAll("[data-pk]").forEach(b => b.onclick = () => { draft.pk = b.dataset.pk; render(true) });
    v.querySelectorAll("[data-enter]").forEach(b => b.onclick = () => { const id = b.dataset.enter; draft = {}; joinSpace(id, mySeat(SP[id])) });
    const go_ = async () => {
      keep(); await myIdReady;
      if (draft.pm === "make"){
        const code = newCode();
        if (!await putSpace(code, { names: { a: "", b: "" }, colors: {}, kind: draft.pk, start: "", ts: Date.now(), joined: { a: myId || true } })) return;
        draft = {}; joinSpace(code, "a"); return;
      }
      const code = (draft.code || "").replace(/\D/g, "");
      if (!SP[code] && db){ const d = (await db.collection("spaces").doc(code).get().catch(() => null))?.data?.(); if (d) SP = { ...SP, [code]: d } }
      if (!SP[code]) { toast("코드 없음"); return }
      // 내 계정이 이미 들어가 있는 코드면 그 자리로 바로 들어간다
      const seat = mySeat(SP[code]);
      if (seat) { draft = {}; joinSpace(code, seat); return }
      draft = { pm: "join", found: code }; render(true);
    };
    v.querySelector("#p-go").onclick = go_;
    if (draft.auto){ delete draft.auto; go_() }
    bindLogout(v);
    v.querySelector("#p-code")?.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) go_() });

// 연결 뒤 처음: 내 이름과 내 색 (상대가 고른 색은 막는다)
function setupHTML(){

// 공유 창이 없으면(안드로이드 앱 등) 클립보드에 복사한다
const INVITE_BASE = "https://mnizom.github.io/hito/";
async function sendInvite(code){
  const url = window.hitoApp ? `${INVITE_BASE}?join=${code}` : "", text = `HiTo에서 같이 써요 · 연결 코드 ${code}`;
  if (navigator.share){ try { await navigator.share(url ? { text, url } : { text }); return } catch (e){ if (e?.name === "AbortError") return } }
  navigator.clipboard.writeText(url ? `${text}\n${url}` : text).then(() => toast(url ? "링크 복사 · 카톡에 붙여 넣어 주세요" : "복사"), () => toast(url || code));
}

// ♡ 사랑점수와 속마음은 쓴 사람만 보고, 상대는 일기 화면에서 ♥를 써서 열람한 뒤에만 본다
// (홈에서는 속마음이 있는지조차 드러내지 않는다)
// ♡ 사랑점수 = 지금 상대를 얼마나 사랑하는지. 쓴 사람에게만 보이고 상대에게는 어디서도 안 보인다
function moodChips(p){
  const m = p.mood || {};
  const chip = (cls, ic, label, val) => val == null ? "" : `<span class="mood ${cls}" title="${label}">${ic}<span class="m"><i style="width:${val}%"></i></span>${val}</span>`;
  const love = p.who === me ? chip("love", "♡", "사랑점수 · 나만 보여요", m.love) : "";
  return `<div class="moods">${chip("smile", "☺", "기분", m.smile)}${chip("energy", "💊", "에너지", m.energy)}${love}</div>`;
}
function postHTML(p){
  const replies = (p.replies || []).map(r => `<div class="reply ${r.who}">${esc(r.text)}</div>`).join("");
  const liked = p.likes?.[me];
  const theirs = p.who !== me;
  // 하트는 사진 바로 밑. 상대 글이면 누를 수 있고, 내 글이면 상대가 눌렀는지만 보인다
  const like = theirs
    ? `<button class="like ${liked ? "on" : ""}" data-like="${p.id}" aria-pressed="${!!liked}" aria-label="하트">${svg("heart")}</button>`
    : Object.values(p.likes || {}).some(Boolean) ? `<span class="like on" aria-label="하트 받음">${svg("heart")}</span>` : "";
  return `<article class="post card" id="p-${p.id}">
    <div class="head"><b class="who-${p.who}">${esc(nameOf(p.who))}</b><time>${hm(p.ts)}</time></div>
    <div class="media">${media(p)}</div>
    ${like ? `<div class="actions">${like}</div>` : ""}
    <div class="voice">${esc(p.text)}</div>
    ${moodChips(p)}
    ${replies}
    <div class="actions">
      ${theirs ? `<label class="inline"><input type="text" id="r-${p.id}" placeholder="" aria-label="한마디 남기기"><button class="send" data-reply="${p.id}" aria-label="남기기">${svg("send")}</button></label>`
      : `<span style="flex:1"></span><button class="textbtn" data-delpost="${p.id}">지우기</button>`}
    </div></article>`;
}
function bindPosts(v){
  v.querySelectorAll("[data-like]").forEach(b => b.onclick = () => {
    const p = S.posts[b.dataset.like]; put("posts", b.dataset.like, { ...p, likes: { ...(p.likes || {}), [me]: !p.likes?.[me] } });
  });
  const send = id => {
    const inp = v.querySelector("#r-" + id), t = inp.value.trim(); if (!t) return inp.focus();
    inp.value = ""; inp.blur();
    const p = S.posts[id]; put("posts", id, { ...p, replies: [...(p.replies || []), { who: me, text: t, ts: Date.now() }] });
  };
  v.querySelectorAll("[data-reply]").forEach(b => b.onclick = e => { e.preventDefault(); send(b.dataset.reply) });
  v.querySelectorAll("input[id^='r-']").forEach(i => i.onkeydown = e => { if (e.key === "Enter" && !e.isComposing) send(i.id.slice(2)) });
  v.querySelectorAll("[data-delpost]").forEach(b => b.onclick = () => armDelete(b, () => del("posts", b.dataset.delpost)));
}

// ♥ 하트 = 점수. 질문에 답하거나 상대가 내 상황에 하트를 누르면 +1,
// 상황 속마음을 하나 볼 때마다 −1
const HEART_COST = 1;
function heartBalance(){
  const qs = allQuestions();
  const answered = qs.filter(q => (q[me] || "").trim()).length + all("aiq").filter(q => q.for === me && q.ans).length;
  const liked = Object.values(S.posts).filter(p => p.who === me && p.likes?.[other(me)]).length;
  const spent = Object.values(S.posts).filter(d => d.unlockedBy === me).length
    + qs.filter(q => q.seenBy?.[me]).length;
  return answered + liked - spent * HEART_COST;
}
const canSpend = () => heartBalance() >= HEART_COST;
// 질문은 Claude만 만든다 (aiq). 예전에 사람이 만든 질문(questions)은 화면에 내지 않는다
const allQuestions = () => all("questions").filter(q => q.text);

// ? 탭: Claude가 나에게 보낸 질문을 카드로 한 장씩.
// 오른쪽으로 밀면 O(그렇다), 왼쪽은 X(아니다), 기타는 직접 쓰고, 패스한 카드는 다시 내지 않는다 (그 주제는 2주 동안 피한다)
const deck = () => all("aiq").filter(q => q.for === me && !q.ans && !q.pass).sort((x, y) => x.ts - y.ts);
const answerAiq = (id, ans) => { put("aiq", id, { ...S.aiq[id], ans, ats: Date.now() }); toast("♥+1") };
const passAiq = id => put("aiq", id, { ...S.aiq[id], pass: Date.now() });
VIEWS.questions = () => {
  const q = deck()[0];
  return { title: "?", html: `
    <div class="keybar"><span style="color:var(--accent);font-size:18px">♥</span><b>${heartBalance()}</b></div>
    ${q ? `<div class="qcard" id="qcard" data-id="${q.id}"><span class="mark x" aria-hidden="true">X</span><span class="mark o" aria-hidden="true">O</span>
        <div class="qtext">${esc(q.q)}</div></div>
      <div class="qbtns"><button id="q-x" aria-label="아니다">X</button><button id="q-pass">패스</button><button id="q-o" aria-label="그렇다">O</button></div>
      <label class="inline"><input type="text" id="q-etc" placeholder="기타" aria-label="기타"><button class="send" id="q-etc-send" aria-label="보내기">${svg("send")}</button></label>`
    : empty("plus", "질문 없음", "")}`,
  bind: v => {
    autoAI();
    const c = v.querySelector("#qcard"); if (!c) return;
    const id = c.dataset.id;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const fly = (dir, then) => { if (reduce || !dir) return then();
      c.style.transform = `translateX(${dir * 120}%) rotate(${dir * 18}deg)`; c.style.opacity = "0"; setTimeout(then, 230) };
    const o = () => fly(1, () => answerAiq(id, "그렇다")), x = () => fly(-1, () => answerAiq(id, "아니다"));
    v.querySelector("#q-o").onclick = o;
    v.querySelector("#q-x").onclick = x;
    v.querySelector("#q-pass").onclick = () => fly(0, () => passAiq(id));
    const etc = () => { const i = v.querySelector("#q-etc"), t = i.value.trim(); if (!t) return i.focus(); i.blur(); answerAiq(id, "기타: " + t) };
    v.querySelector("#q-etc-send").onclick = e => { e.preventDefault(); etc() };
    v.querySelector("#q-etc").onkeydown = e => { if (e.key === "Enter" && !e.isComposing) etc() };
    // 카드 밀기
    let x0 = null, dx = 0;
    const reset = () => { x0 = null; dx = 0; c.style.transition = ""; c.style.transform = ""; c.style.setProperty("--o", 0); c.style.setProperty("--x", 0) };
    c.addEventListener("pointerdown", e => { x0 = e.clientX; dx = 0; c.setPointerCapture(e.pointerId); c.style.transition = "none" });
    c.addEventListener("pointermove", e => { if (x0 == null) return; dx = e.clientX - x0;
      c.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
      c.style.setProperty("--o", Math.max(0, Math.min(1, dx / 90))); c.style.setProperty("--x", Math.max(0, Math.min(1, -dx / 90))) });
    c.addEventListener("pointerup", () => { if (x0 == null) return; const d = dx; x0 = null; c.style.transition = "";
      if (d > 90) o(); else if (d < -90) x(); else reset() });
    c.addEventListener("pointercancel", reset);
  }};
};

// ---------- 모듈러: 두 사람이 쓴 것을 Claude가 모듈러로 정리하고, 질문을 보내고, 리포트를 쓴다 ----------
// Claude는 이 페이지에서 직접 부른다 (claude.use("sample"), 연 사람의 claude.ai 사용량). 없으면 아무것도 하지 않는다.
// 화면은 없다. ? 탭을 열 때 autoAI가 마지막 정리 뒤에 생긴 글을 모아 한 번에 정리하고 (meta/ai.cut),
// 오늘 받을 질문이 남았으면 새 질문을 카드 뒤에 쌓는다. 리포트와 내가 묻기는 우리 탭 · 관계에서 부른다.
// 질문이 집요하지 않게: 하루에 사람마다 최대 DAILY_Q장, 패스한 주제는 2주 동안 피하고, 최근 2일 안의 글은 바로 되묻지 않는다.
let ai = null, aiState = "";
const DAILY_Q = 2, DAY = 864e5, RECENT = 2 * DAY, AVOID = 14 * DAY;
const aiCut = () => S.meta.ai?.cut || 0;
const tag = w => `${w}(${nameOf(w)})`;
const people = () => `a = ${nameOf("a")}, b = ${nameOf("b")} (${isFriend() ? "친구" : "연인"} 사이)`;
const md_ = ts => { const d = new Date(ts); return `${pad(d.getMonth() + 1)}.${pad(d.getDate())}` };
const todayStart = () => new Date(ymd(new Date())).getTime();
// 오늘 그 사람에게 더 보낼 수 있는 질문 수 (내가 Claude에게 물어서 생긴 카드는 세지 않는다)
const qLeft = w => Math.max(0, DAILY_Q - all("aiq").filter(q => q.for === w && !q.fromAsk && q.ts >= todayStart()).length);
const avoidList = w => all("aiq").filter(q => q.for === w && q.pass && q.pass > Date.now() - AVOID).map(q => q.q);
// 마지막 정리 뒤에 생긴 글 · 답. 속마음도 넣되 속마음이라고 표시한다. 최근 2일 안의 것은 (최근) 표시
function pendingItems(){
  const c = aiCut(), out = [], now = Date.now();
  const push = (ts, line) => out.push({ ts, line: `${ts > now - RECENT ? "(최근) " : ""}${line}` });
  all("posts").forEach(p => {
    if (p.ts > c){
      if ((p.text || "").trim()) push(p.ts, `${tag(p.who)}의 한마디: ${p.text}`);
      if ((p.secret || "").trim()) push(p.ts, `${tag(p.who)}의 속마음: ${p.secret}`);
    }
    (p.replies || []).forEach(r => r.ts > c && push(r.ts, `${tag(r.who)}가 ${tag(p.who)}의 한마디 「${p.text}」에 단 말: ${r.text}`));
  });
  all("aiq").forEach(q => q.ans && q.ats > c && push(q.ats, `${tag(q.for)}의 답 · 질문 「${q.q}」: ${q.ans}`));
  return out.sort((x, y) => x.ts - y.ts);
}
const modsLines = (ms = all("mods")) => ms.sort((x, y) => x.ts - y.ts).slice(-400)
  .map(m => `${m.id} | ${md_(m.ts)} | ${m.who}→${m.about} | ${m.desire ? "바람 · " : ""}${m.kind === "가설" ? "가설 · " : ""}${m.open ? "열림 · " : ""}${m.text}`).join("\n") || "(아직 없음)";

const ASK_RULES = n => `- 물을것: 그 사람이 그렇다/아니다로 답할 수 있는 한 문장. 사람마다 최대 ${n}개.
  · 관계에 대한 것만 묻지 말고 그 사람 자신(취향, 일상, 요즘 하고 싶은 것, 바라는 것)에 대한 질문을 절반 이상 섞는다. 그 사람이 무엇을 바라는지 확인한다.
  · 대부분은 가볍게. 깊은 질문은 대략 네 개에 하나. 서운함·짜증·다툼 같은 무거운 주제는 그 사람이 먼저 글로 꺼낸 것만, 꺼낸 지 2일이 지난 뒤에만 묻는다.
  · (최근) 표시가 붙은 글의 내용을 바로 되묻지 않는다.
  · 상대 이름이 들어간 질문보다 「나는 ~」 질문을 더 많이.
  · 단정하지 말고 「나는 ~한 편이다」「나는 ~할 때가 있다」처럼 끝을 열어 둔다. 언제·어디서 같은 조건과 행동을 문장 안에 넣는다. 이유나 정의를 통째로 묻지 않는다.
  · [피할 주제]와 겹치는 질문은 만들지 않는다.`;
const avoidBlock = () => ["a", "b"].map(w => `${tag(w)}: ${avoidList(w).join(" / ") || "(없음)"}`).join("\n");
const RULES = () => `너는 커플 앱에서 두 사람의 글과 답을 「모듈러」로 정리한다. ${people()}.
모듈러 = 단독으로 참·거짓이 갈리는 한 줄 명제. 기호·날짜 머리말·「그걸」 같은 지시어·윗줄에 기대는 문장을 쓰지 않는다.
- 주인: 그 생각을 가진 사람(a 또는 b). 대상: 누구에 대한 것인지(a 또는 b).
  주인과 대상이 같으면 「나는/내가/나의」를 주어로 쓴다 (예: 나는 기념일에 상대가 꾸미지 않으면 서운하다).
  주인과 대상이 다르면 주인이 인식한 상대를 「상대이름은 ~다」로 쓴다 (예: ${nameOf("b")}는 답이 늦어도 마음이 식은 게 아니다).
- 욕망: 「나는 ~하고 싶다」 꼴이면 true. 열림: 아직 참·거짓이 닫히지 않은 것(~것 같다, 궁금함, 모름, 추측)이면 true.
- 속마음: 속마음 글에서만 나온 것이면 true. 속마음 글에서 나온 것은 구체적인 사건·말·사람·장소·때를 빼고, 그 밑에 깔린 큰 바람 하나만 「나는 ~하고 싶다」 꼴로 남긴다.
  (예: 속마음 「어제 통화 끝나고 괜히 서운했어」 → 「나는 상대와 늘 이어져 있다고 느끼고 싶다」)
- 종류: 글에 직접 있는 것은 "명제", 네가 여러 모듈러를 이어 세운 것은 "가설".
- 이미 있는 모듈러와 같은 것이면 새로 만들지 말고 그 id를 덮어쓴다 (더 구체적이면 합쳐서, 반대면 바뀐 내용으로). 같은 내용이 두 id에 있으면 하나를 덮어쓰고 나머지를 삭제한다.
- 질문 답: 그렇다면 질문 명제 그대로, 아니다면 그 부정으로, 모르겠다면 열림으로, 기타면 그 답을 명제로.`;

function organizePrompt(items){
  return `${RULES()}
${ASK_RULES(Math.max(qLeft("a"), qLeft("b")))}

[피할 주제]
${avoidBlock()}

[지금까지의 모듈러] (id | 날짜 | 주인→대상 | 명제)
${modsLines()}

[새로 들어온 글과 답]
${items.map(i => i.line).join("\n")}

새 글과 답을 정리해서 JSON 하나로만 답한다:
{"추가":[{"주인":"a","대상":"a","명제":"…","욕망":false,"열림":false,"속마음":false,"종류":"명제"}],
 "덮어쓰기":[{"id":"기존 id","명제":"…","열림":false}],
 "삭제":["기존 id"],
 "물을것":[{"누구에게":"a","명제":"나는 …"}],
 "보고":"무엇을 정리했는지 한두 문장"}`;
}
function askPrompt(w, n){
  const sent = all("aiq").filter(q => q.for === w).map(q => q.q);
  return `${RULES()}
${ASK_RULES(n)}

[피할 주제]
${avoidBlock()}

[지금까지의 모듈러]
${modsLines()}

[이미 보낸 질문]
${sent.join("\n") || "(없음)"}

${tag(w)}에게 물을 새 질문 ${n}개를 만든다. 이미 보낸 질문과 겹치지 않게.
JSON 하나로만 답한다: {"물을것":["나는 …"]}`;
}
// 리포트와 내 질문의 답은 읽는 사람(w)에게 맞춰 쓴다. 모듈러라는 말은 쓰지 않는다
const PLAIN = w => `- ${nameOf(w)}님이 읽는다. 존댓말로, 일상적인 말로 쓴다.
- "모듈러", "명제", "가설", "욕망", "관여", "쾌" 같은 말을 쓰지 않는다. "바라는 것", "하고 싶은 것", "좋았던 것", "아쉬웠던 것"처럼 말한다.
- 큰 이야기로 쓴다. 날짜·사건·주고받은 말을 하나하나 늘어놓지 않는다.
- 자료에 없는 것은 지어내지 않는다. 짐작은 "~인 것 같아요"로 말한다.
- 마크다운 기호 없이 평문. 문단 사이는 빈 줄 하나.`;
function moodLines(who){
  const now = Date.now(), win = (k, ms) => { const xs = all("posts").filter(p => p.who === who && p.ts > now - ms && p.mood?.[k] != null);
    return xs.length ? Math.round(xs.reduce((n, p) => n + p.mood[k], 0) / xs.length) : "-" };
  return `${tag(who)} 최근 1주일 기분 ${win("smile", 7 * DAY)} 에너지 ${win("energy", 7 * DAY)} / 최근 한 달 기분 ${win("smile", 30 * DAY)} 에너지 ${win("energy", 30 * DAY)}`;
}
const dataOf = who => modsLines(all("mods").filter(m => m.who === who));
// 나: 나는 어떤 사람인지 + 상대와의 관계에서 바라는 것
function selfPrompt(w){
  const o = nameOf(other(w));
  return `${nameOf(w)}님이 앱에 남긴 기록을 정리한 자료로 ${nameOf(w)}님 자신에 대한 리포트를 쓴다. 오늘은 ${ymd(new Date())}.
${PLAIN(w)}
구성:
"${nameOf(w)}님은 이런 사람이군요!"로 시작해, ${nameOf(w)}님이 자기 삶에서 바라는 것들을 큰 줄기로 3~5문장.
빈 줄 뒤 "${o}님과의 관계에서는"으로 시작해, ${nameOf(w)}님이 ${o}님과의 관계에서 바라는 것을 2~4문장.

[${nameOf(w)}님 자료] (id | 날짜 | 누가→누구에 대해 | 내용)
${dataOf(w)}

[기분·에너지 평균 (0~100)]
${moodLines(w)}`;
}
// 상대: 상대는 어떤 사람인지 + 나와의 관계에서 바라는 것 + 내가 해 줄 수 있는 것 + 최근 하루
function otherPrompt(w){
  const o = other(w), O = nameOf(o), W = nameOf(w);
  return `두 사람(${people()})이 앱에 남긴 기록을 정리한 자료로, ${W}님에게 ${O}님에 대해 알려 주는 리포트를 쓴다. 오늘은 ${ymd(new Date())}.
${PLAIN(w)}
- ${W}님 자신의 생각은 리포트에 쓰지 않는다. [${W}님 자료]는 제안이 ${W}님이 바라는 것을 해치지 않는지 확인하는 데만 쓴다.
구성:
"${O}님은 이런 사람이군요!"로 시작해, ${O}님이 자기 삶에서 바라는 것들을 큰 줄기로 3~5문장.
빈 줄 뒤 "${W}님과의 관계에서는"으로 시작해, ${O}님이 ${W}님과의 관계에서 바라는 것을 2~4문장.
빈 줄 뒤 "${W}님이 해 줄 수 있는 것"으로 시작해, ${W}님이 바라는 것을 해치지 않는 선에서 해 줄 수 있는 것 2~3가지를 한 문장씩.
빈 줄 뒤 "${O}님은 최근에 이런 하루를 보냈어요"로 시작해, 최근 1주일을 큰 흐름으로 2~3문장.

[${O}님 자료] (id | 날짜 | 누가→누구에 대해 | 내용)
${dataOf(o)}

[${W}님 자료 — 리포트에 쓰지 말 것]
${dataOf(w)}

[${O}님 기분·에너지 평균 (0~100)]
${moodLines(o)}`;
}
// 우리: 요새 어떻게 지내는지 + 다섯 기준 (모듈러이론의 관여·정확히 앎·채움·합류와 충돌·비대칭을 일상 말로). 두 사람 모두에게 같은 글
function usPrompt(){
  const A = nameOf("a"), B = nameOf("b");
  return `두 사람(${people()})이 앱에 남긴 기록을 정리한 자료로, 두 사람이 함께 읽는 리포트를 쓴다. 오늘은 ${ymd(new Date())}.
- 두 사람이 함께 읽는다. 존댓말로, 일상적인 말로, "두 분"이라고 부른다.
- "모듈러", "명제", "가설", "욕망", "관여", "쾌", "합류", "비대칭" 같은 말을 쓰지 않는다.
- 큰 이야기로 쓴다. 날짜·사건·주고받은 말을 하나하나 늘어놓지 않는다. 한쪽의 속마음에서 나온 내용은 상대가 알아챌 만큼 구체적으로 쓰지 않는다.
- 자료에 없는 것은 지어내지 않는다. 짐작은 "~인 것 같아요"로. 마크다운 기호 없이 평문. 문단 사이는 빈 줄 하나.
구성 (소제목은 한 줄로):
요즘 두 분은 — 요새 어떻게 지내고 있는지 2~3문장.
서로에게 마음을 쓰고 있나요 — 각자 상대가 잘 지내기를 바라고, 상대를 자기 바람 안에 두고 있는지.
서로를 잘 알고 있나요 — ${A}님이 아는 ${B}님과 ${B}님 자신이 말한 ${B}님이 맞는지, 그 반대도.
서로 바라는 걸 채워 줄 수 있나요 — 각자 바라는 것을 상대가 자기 힘 안에서 채우고 있거나 채울 수 있는지.
같이 좋을 때와 부딪힐 때 — 한 가지 일로 둘 다 좋아지는 곳, 바라는 것이 부딪히는 곳.
한쪽으로 기운 곳 — 한쪽만 마음을 쓰거나 한쪽만 채워 주는 곳.
각 소제목 아래 2~3문장. 자료가 모자란 곳은 "아직 잘 모르겠어요"라고만.

function answerPrompt(w, q){
  return `두 사람(${people()})이 앱에 남긴 기록을 정리한 자료가 아래에 있다. ${nameOf(w)}님이 질문했다: 「${q}」
${PLAIN(w)}

- 자료로 답할 수 있으면 답한다.
- 자료가 모자라면 "모름"을 true로 하고, 그 빈칸을 채우려고 ${nameOf(other(w))}님에게 물을 질문 하나를 만든다. ${nameOf(other(w))}님이 그렇다/아니다로 답할 수 있게 「나는 ~한 편이다」 꼴로, 부드럽게, 누가 물었는지 드러나지 않게.

[자료]
${modsLines()}`;
}

const aiErr = e => ({ not_granted: "Claude 사용을 허락하지 않음", sampling_disabled: "Claude를 쓸 수 없는 계정", rate_limited: "잠시 뒤에 다시",
  invalid_json: "결과를 읽지 못함 · 다시 눌러 주세요", prompt_too_large: "기록이 너무 많음", refused: "Claude가 거절함" }[e?.code] || "Claude 오류");
async function runAI(label, fn){
  if (aiState || !ai) return;
  aiState = label; render();
  try { await fn() } catch (e) { if (e?.code !== "cancelled" && e?.code !== "not_granted") toast(aiErr(e)) }
  finally { aiState = ""; render() }
}
const AB = w => w === "a" || w === "b";
function organize(){
  if (!pendingItems().length) return;
  return runAI("정리하는 중…", organizeNow);
}
async function organizeNow(){
  const items = pendingItems(); if (!items.length) return;
  const cut = Date.now(); // 정리하는 동안 새로 쓴 글은 다음 정리로
  {
    const r = await ai.json(organizePrompt(items), { cache: false }) || {};
    const now = Date.now(), left = { a: qLeft("a"), b: qLeft("b") };
    (r.추가 || []).forEach(m => { if (!m?.명제 || !AB(m.주인)) return;
      put("mods", uid(), { who: m.주인, about: AB(m.대상) ? m.대상 : m.주인, text: String(m.명제), desire: !!m.욕망, open: !!m.열림, secret: !!m.속마음, kind: m.종류 === "가설" ? "가설" : "명제", ts: now }) });
    (r.덮어쓰기 || []).forEach(m => { const cur = S.mods[m?.id]; if (cur && m.명제) put("mods", m.id, { ...cur, text: String(m.명제), open: typeof m.열림 === "boolean" ? m.열림 : cur.open, ts: now }) });
    (r.삭제 || []).forEach(id => S.mods[id] && del("mods", id));
    (r.물을것 || []).forEach(q => { if (q?.명제 && AB(q.누구에게) && left[q.누구에게]-- > 0) put("aiq", uid(), { for: q.누구에게, q: String(q.명제), ts: now, by: me }) });
    put("meta", "ai", { ...(S.meta.ai || {}), cut, last: { ts: now, by: me, report: String(r.보고 || "") } });
  }
}
function moreQuestions(){

const REPORTS = {
  me: () => ({ key: "self_" + me, prompt: selfPrompt(me) }),
  other: () => ({ key: "about_" + me, prompt: otherPrompt(me) }),
  us: () => ({ key: "us", prompt: usPrompt(), opts: { modelTier: "complex" } }),

// 우리 탭: 통계(기분 · 에너지) · 속마음 · 관계
const W = 340, H = 190, L = 30, R = 12, T = 12, B = 26;
function trendChart(series, label){ // series: [{arr, color, key}]
  const pts = series.flatMap(s => s.arr);
  const t0 = Math.min(...pts.map(p => p.ts)), t1 = Math.max(...pts.map(p => p.ts)), span = Math.max(1, t1 - t0);
  const x = ts => L + (W - L - R) * (ts - t0) / span, y = v => T + (H - T - B) * (1 - v / 100);
  const line = ({ arr, color: c, key: k }) => { if (!arr.length) return ""; const pt = p => `${x(p.ts).toFixed(1)},${y(p.mood[k]).toFixed(1)}`;
    return `<path d="${arr.map((p, i) => (i ? "L" : "M") + pt(p)).join("")}${arr.length > 1 ? `L${x(arr.at(-1).ts).toFixed(1)},${y(0)}L${x(arr[0].ts).toFixed(1)},${y(0)}Z` : ""}" fill="var(--${c})" fill-opacity=".08" stroke="none"/>
    <polyline points="${arr.map(pt).join(" ")}" fill="none" stroke="var(--${c})" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${arr.map((p, i) => `<circle cx="${x(p.ts).toFixed(1)}" cy="${y(p.mood[k]).toFixed(1)}" r="${i === arr.length - 1 ? 4.5 : 2.4}" fill="${i === arr.length - 1 ? "var(--surface)" : `var(--${c})`}" stroke="var(--${c})" stroke-width="2"/>`).join("")}` };
  const grid = [0, 50, 100].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--hair)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="10.5" fill="var(--ink-2)">${v}</text>`).join("");
  const md = ts => { const d = new Date(ts); return `${d.getMonth() + 1}.${d.getDate()}` };
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">${grid}
    <text x="${L}" y="${H - 6}" font-size="10.5" fill="var(--ink-2)">${md(t0)}</text><text x="${W - R}" y="${H - 6}" font-size="10.5" text-anchor="end" fill="var(--ink-2)">${md(t1)}</text>
    ${series.map(line).join("")}</svg>`;
}
const series = (w, k) => all("posts").filter(p => p.who === w && p.mood?.[k] != null).sort((x, y) => x.ts - y.ts).slice(-14);
const avgOf = (arr, k) => arr.length ? Math.round(arr.reduce((n, p) => n + p.mood[k], 0) / arr.length) : "–";
function bothTrend(k, ic, label){
  const pa = series("a", k), pb = series("b", k);
  if (!pa.length && !pb.length) return empty("chart", "데이터 없음", "");
  return `<div class="card" style="display:flex;flex-direction:column;gap:12px">
      <span class="lab">${ic} ${label}</span>
      ${trendChart([{ arr: pa, color: "a", key: k }, { arr: pb, color: "b", key: k }], `${label} 변화 그래프`)}
      <div class="legend"><span><i style="background:var(--a)"></i>${esc(nameOf("a"))} 평균 ${avgOf(pa, k)}</span><span><i style="background:var(--b)"></i>${esc(nameOf("b"))} 평균 ${avgOf(pb, k)}</span></div>
    </div>`;
}
function oneTrend(w, k, ic, label){
  const arr = series(w, k);
  return `<div class="card" style="display:flex;flex-direction:column;gap:12px">
      <span class="lab">${ic} ${label}</span>
      ${arr.length ? `${trendChart([{ arr, color: w, key: k }], `${label} 변화 그래프`)}<span class="small muted">평균 ${avgOf(arr, k)}</span>`
        : `<span class="small muted">데이터 없음</span>`}
    </div>`;
}
function myLoveTrend(){
  const mine = series(me, "love");
  return `<div class="card" style="display:flex;flex-direction:column;gap:12px">
      <span class="lab" style="display:flex;gap:6px;align-items:center">${svg("lock")}내 마음</span>
      ${mine.length ? `${trendChart([{ arr: mine, color: me, key: "love" }], "내 마음 변화")}
      <span class="small muted">최근 ${mine.at(-1).mood.love} · 평균 ${avgOf(mine, "love")}</span>`
      : `<span class="small muted">데이터 없음</span>`}
    </div>`;
}
// 리포트 + 내가 Claude에게 묻기(asks).
// 내 질문 중 상대 카드로 물어본 것은, 상대가 답하고 정리된 뒤 이 화면을 열면 다시 답한다.
function reportHTML(kind){
  const key = REPORTS[kind]().key, rp = S.meta[key];
  if (ai && !aiState){
    const redo = all("asks").find(a => a.by === me && !a.done && a.aiq && S.aiq[a.aiq]?.ans && S.aiq[a.aiq].ats <= aiCut() && (a.ats || 0) < aiCut());
    if (redo) setTimeout(() => answerAsk(redo.id), 0);
  }
  const d = rp && new Date(rp.ts);
  const asks = all("asks").filter(a => a.by === me).sort((x, y) => y.ts - x.ts);
  return `<section style="margin-top:8px">
      ${rp ? `<div class="voice report">${esc(rp.text)}</div><span class="small muted">${d.getMonth() + 1}.${d.getDate()} ${hm(rp.ts)}</span>` : ""}
      ${ai ? `<button class="btn primary" id="rp-go" style="align-self:flex-start" ${aiState ? "disabled" : ""}>${aiState || (rp ? "다시 쓰기" : "리포트 쓰기")}</button>` : ""}
    </section>
    <section>
      <label class="inline"><input type="text" id="ask-in" placeholder="물어보기" aria-label="Claude에게 물어보기"><button class="send" id="ask-send" aria-label="보내기">${svg("send")}</button></label>
      ${asks.map(a => `<div class="ask"><b>${esc(a.q)}</b>${a.a ? `<div class="voice" style="font-size:15.5px">${esc(a.a)}</div>` : `<span class="small muted">…</span>`}</div>`).join("")}
    </section>`;
}
function bindReport(v, kind){
  v.querySelector("#rp-go")?.addEventListener("click", () => writeReport(kind));
  const send = () => { const i = v.querySelector("#ask-in"), q = i.value.trim(); if (!q) return i.focus();
    i.value = ""; i.blur(); const id = uid(); put("asks", id, { by: me, q, ts: Date.now() }); answerAsk(id) };
  v.querySelector("#ask-send")?.addEventListener("click", e => { e.preventDefault(); send() });
  v.querySelector("#ask-in")?.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) send() });
}
// 우리 탭: 나 · 상대 · 우리. 나·상대는 그 사람의 기분·에너지·속마음 비율(+ 나는 내 마음)과 리포트, 우리는 두 사람 기분·에너지를 겹쳐 그리고 리포트
VIEWS.stats = () => {
  const sub = route.sub || "me", o = other(me);
  const body = sub === "me" ? oneTrend(me, "smile", "☺", "기분") + oneTrend(me, "energy", "💊", "에너지") + compareHTML(me) + myLoveTrend()
    : sub === "other" ? oneTrend(o, "smile", "☺", "기분") + oneTrend(o, "energy", "💊", "에너지") + compareHTML(o)
    : bothTrend("smile", "☺", "기분") + bothTrend("energy", "💊", "에너지");
  return { title: "우리", html: `
    <div style="display:flex;justify-content:center"><div class="seg">${[["me", "나"], ["other", esc(nameOf(o))], ["us", "우리"]].map(([k, l]) =>
      `<button data-sub="${k}" aria-pressed="${sub === k}">${l}</button>`).join("")}</div></div>
    ${body}
    ${reportHTML(sub)}`,
  bind: v => { v.querySelectorAll("[data-sub]").forEach(b => b.onclick = () => { route.sub = b.dataset.sub; render(true) }); bindReport(v, sub) } };
};
// 속마음 비교 = 밖으로 말한 글자 수 대비 속마음 글자 수 (공백 제외)
//   밖으로 말한 것: 상황의 한마디
//   속마음: 상황의 속마음 글
const chars = s => [...String(s || "").replace(/\s/g, "")].length;
function speechCounts(w){
  let said = 0, inner = 0;
  all("posts").forEach(p => { if (p.who === w){ said += chars(p.text); inner += chars(p.secret) } });
  return { said, inner, ratio: said ? inner / said : null };
}
function compareHTML(only){
  const c = { a: speechCounts("a"), b: speechCounts("b") };
  const max = Math.max(1, c.a.said, c.a.inner, c.b.said, c.b.inner);
  const pct = n => (n / max * 72).toFixed(1); // 오른쪽에 글자 수 들어갈 자리를 남긴다
  const card = w => `<div class="card ratio" style="display:flex;flex-direction:column;gap:12px">
      <div class="post"><div class="head"><b class="who-${w}">${esc(nameOf(w))}</b></div></div>
      <div class="big"><b class="who-${w}">${c[w].ratio == null ? "–" : c[w].ratio.toFixed(2)}</b><span>배</span></div>
      <div class="bars">
        <div class="bar"><span>한마디</span><div class="track"><div class="fill said" style="width:${pct(c[w].said)}%"></div><span class="num">${c[w].said.toLocaleString()}자</span></div></div>
        <div class="bar"><span>속마음</span><div class="track"><div class="fill ${w}" style="width:${pct(c[w].inner)}%"></div><span class="num">${c[w].inner.toLocaleString()}자</span></div></div>
      </div></div>`;
  return only ? card(only) : card(me) + card(other(me));
}
const KINDS = [["couple", "연인"], ["friend", "친구"]];
VIEWS.settings = () => {
  const c = couple();
  draft.kind ??= c.kind;
  const ids = joinedList().sort((x, y) => (SP[x]?.ts || 0) - (SP[y]?.ts || 0));
  const spaceRow = id => {
    const sc = id === space ? c : { names: { a: "", b: "" }, kind: "couple", ...(SP[id] || {}) };
    return `<li><button data-space="${id}" aria-pressed="${id === space}" class="space-row">
      <span class="pair"><span class="who-a">${esc(sc.names.a)}</span> <span class="muted">&amp;</span> <span class="who-b">${esc(sc.names.b)}</span></span>
      <span class="tag ${sc.kind === "friend" ? "b" : "a"}">${sc.kind === "friend" ? "친구" : "연인"}</span>
      </button></li>`;
  };
  const seg = (key, val) => `<div class="seg">${KINDS.map(([k, l]) => `<button data-${key}="${k}" aria-pressed="${val === k}">${l}</button>`).join("")}</div>`;
  return { title: "설정", html: `
    <section><h3>지금 함께하는 사람</h3>
    <div class="card" style="display:flex;flex-direction:column;gap:14px">
      <div class="field"><span class="lab">관계</span>${seg("kind", draft.kind)}</div>
      <div class="field"><label class="lab" for="s-a">첫 번째 사람</label><input type="text" id="s-a" value="${esc(draft.na ?? c.names.a)}" style="color:var(--a)"></div>
      <div class="field"><label class="lab" for="s-b">두 번째 사람</label><input type="text" id="s-b" value="${esc(draft.nb ?? c.names.b)}" style="color:var(--b)"></div>
      <div class="field"><label class="lab" for="s-start">${draft.kind === "friend" ? "친구 된 날" : "사귄 날"} </label><input type="date" id="s-start" value="${esc(draft.start ?? c.start)}"></div>
      <button class="btn primary" id="s-save">저장</button>
    </div>
    <div class="field"><span class="lab">내 색</span>${swatches(c.colors?.[me], c.colors?.[other(me)])}</div>
    <div class="field"><span class="lab">코드</span><span style="font-variant-numeric:tabular-nums;letter-spacing:.15em">${space}</span></div>
    </section>
    <section><h3>사람 바꾸기</h3>
      <ul class="qlist card">${ids.map(spaceRow).join("")}</ul>
      <button class="btn" id="n-add">${svg("plus")} 새 연결</button>
      ${pushHTML()}
      <button class="textbtn" id="leave" style="align-self:flex-start">이 기기에서 나가기</button>
      ${logoutHTML()}
    </section>`,
  bind: v => {
    const keep = () => { draft.na = v.querySelector("#s-a").value; draft.nb = v.querySelector("#s-b").value; draft.start = v.querySelector("#s-start").value };
    v.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { keep(); draft.kind = b.dataset.kind; render(true) });
    v.querySelector("#s-save").onclick = () => {
      putSpace(space, { ...(SP[space] || {}), names: { a: v.querySelector("#s-a").value.trim() || "A", b: v.querySelector("#s-b").value.trim() || "B" },
        start: v.querySelector("#s-start").value, kind: draft.kind });
      draft = {}; toast("저장");
    };
    v.querySelectorAll("[data-space]").forEach(b => b.onclick = () => { if (b.dataset.space !== space) { switchSpace(b.dataset.space); toast("변경") } });
    v.querySelector("#n-add").onclick = () => go("pair", { backTo: "settings" });
    // 이 기기에서만 연결을 내려놓는다 (기록과 자리는 그대로, 같은 계정으로 다시 들어올 수 있다)
    const lv = v.querySelector("#leave");
    lv.onclick = () => {
      if (!lv.dataset.armed){ lv.dataset.armed = 1; lv.textContent = "한 번 더 누르면 나가요"; lv.classList.add("danger"); return }
      lsSet("hito.joined", JSON.stringify(joinedList().filter(id => id !== space)));
      try { localStorage.removeItem("hito.space") } catch {}
      space = null; me = null; subscribeSpace(); COLS.forEach(c => S[c] = {}); go("home");
    };
    bindPush(v);
    bindLogout(v);
    v.querySelectorAll("[data-color]").forEach(b => b.onclick = () => { keep();
      putSpace(space, { ...SP[space], colors: { ...(SP[space]?.colors || {}), [me]: b.dataset.color } }) });
  }};
};

loadLocal();
render(true);
connect();
myIdReady.then(() => render());
</script>
