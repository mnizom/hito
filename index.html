<script>
// ---------- icons ----------
const ICON = {
  menu: '<path d="M4 7h16M4 12h16M4 17h10"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  heart: '<path d="M12 20s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 7.3 4.2 4.2 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/>',
  send: '<path d="M5 12h13M13 6l6 6-6 6"/>',
  lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="m11 12 8-8M16 7l2 2"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  check: '<path d="m5 12 4.5 4.5L19 7"/>',
  left: '<path d="M15 5l-7 7 7 7"/>', right: '<path d="m9 5 7 7-7 7"/>',
  image: '<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m4 18 5-5 4 4 3-3 4 4"/>',
  chart: '<path d="M4 19h16M7 15l4-5 3 3 5-6"/>', scale: '<path d="M12 4v16M5 8h14M7 8l-3 6a3 3 0 0 0 6 0zM17 8l-3 6a3 3 0 0 0 6 0z"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>',
  home: '<path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/>',
  pen: '<path d="M4 20h4L19 9l-4-4L4 16z"/>', sun: '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>',
  cloud: '<path d="M7 18a4 4 0 0 1-.5-8A5.5 5.5 0 0 1 17 8.5a4.5 4.5 0 0 1 0 9.5z"/>',
};
const svg = (n, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
// 로고 (로고 시안 아티팩트 그대로): Caveat 손글씨 검은 글씨 + 색연필 밑칠(#pencil). 색은 두 사람의 색을 따른다
const LOGO = `<svg class="logo-mark" viewBox="62 30 196 82" role="img" aria-label="HiTo">
  <text class="under" x="163.9" y="94.4" text-anchor="middle" filter="url(#pencil)" style="font:700 98px Caveat,cursive"><tspan fill="var(--logo-a)">Hi</tspan><tspan fill="var(--logo-b)">To</tspan></text>
  <text x="160" y="92" text-anchor="middle" fill="var(--ink)" filter="url(#pen)" style="font:700 98px Caveat,cursive">HiTo</text></svg>`;

// ---------- built-in content ----------
const DAILY_LIMIT = 6; // 하루에 올리는 상황 수. basic: 각자 6개 / pro: 각자 24개
const PLACEHOLDERS = ["cloud", "sun", "heart"];

// ---------- storage: shared db when available, this browser otherwise ----------
// mods = AI가 정리한 모듈러, base = 기본 질문 답 (id = 사람), daily = 오늘 질문 · 기분 (id = 사람_날짜),
// aiq = 상대에게 보낸 질문 (직접 쓴 것 direct / 궁금한 것에서 생긴 것 fromAsk), asks = 내가 Claude에게 물은 것
const COLS = ["meta", "posts", "events", "projects", "mods", "aiq", "asks", "base", "daily"];
const S = Object.fromEntries(COLS.map(c => [c, {}]));
let db = null, mode = "local";
function lsGet(k){ try { return localStorage.getItem(k) } catch { return null } }
function lsSet(k, v){ try { localStorage.setItem(k, v) } catch {} }
// 연결 = 두 사람이 함께 정한 6자리 코드. 한 사람이 코드를 만들고(a), 상대가 그 코드를 넣으면(b) 연결된다.
// 기록은 spaces/<코드>/<컬렉션> 아래에 쌓고, 연결 정보(이름·관계·누가 들어왔는지)는 spaces/<코드>에 둔다.
// 이 기기가 들어간 연결 목록과 각 연결에서 내가 a인지 b인지는 이 기기에만 저장한다.
let space = lsGet("hito.space");
let SP = {};
// 초대 링크(?join=코드)로 열렸으면 코드를 기억해 두고 주소에서는 지운다. 로그인을 거쳐도 남도록 저장한다
{ const q = new URLSearchParams(location.search), c = (q.get("join") || "").replace(/\D/g, "");
  if (c.length === 6) lsSet("hito.invite", c);
  if (q.has("join")) try { q.delete("join"); history.replaceState(null, "", location.pathname + (String(q) ? "?" + q : "") + location.hash) } catch {} }
const colPath = col => `spaces/${space}/${col}`;
const lsData = () => "hito.data." + space;
const lsMe = () => "hito.me." + space;
const joinedList = () => { try { return JSON.parse(lsGet("hito.joined") || "[]") } catch { return [] } };
function loadLocal(){
  try { const d = JSON.parse(lsGet(lsData()) || "{}"); COLS.forEach(c => S[c] = d[c] || {}) } catch {}
  try { SP = JSON.parse(lsGet("hito.spaces") || "{}") } catch {}
}
function saveLocal(){ if (mode === "local") lsSet(lsData(), JSON.stringify(S)) }

const chains = {};
// 저장 권한이 없으면(공개 링크로 들어온 외부 사람 등) 쓰기가 invalid_argument 로 거절된다
const noWrite = e => ["permission_denied", "not_granted", "invalid_argument"].includes(e?.code);
// 저장이 되면 true, 안 되면 false 로 끝나는 약속을 돌려준다
function queue(key, fn){
  const p = (chains[key] || Promise.resolve()).then(fn).then(() => true, e => {
    toast(noWrite(e) ? "저장 권한 없음 · 공유에서 편집자로 초대받아야 해요" : "저장 실패");
    return false;
  });
  chains[key] = p; return p;
}
function put(col, id, obj){
  S[col] = { ...S[col], [id]: obj }; saveLocal(); render();
  const path = colPath(col);
  if (db) queue(path + "/" + id, () => db.collection(path).doc(id).set(obj));
}
function del(col, id){
  const n = { ...S[col] }; delete n[id]; S[col] = n; saveLocal(); render();
  const path = colPath(col);
  if (db) queue(path + "/" + id, () => db.collection(path).doc(id).delete());
}
function putSpace(id, obj){
  const prev = SP[id];
  SP = { ...SP, [id]: obj }; if (mode === "local") lsSet("hito.spaces", JSON.stringify(SP)); render();
  if (!db) return Promise.resolve(true);
  // 저장이 거절되면 화면에 먼저 반영한 것을 되돌린다
  return queue("spaces/" + id, () => db.collection("spaces").doc(id).set(obj))
    .then(ok => { if (!ok){ SP = { ...SP }; if (prev) SP[id] = prev; else delete SP[id]; render(true) } return ok });
}
let unsubs = [];
function subscribeSpace(){
  unsubs.forEach(u => u()); unsubs = [];
  if (!space) return;
  unsubs = COLS.map(col => db.collection(colPath(col)).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = d.data() }); S[col] = m; render();
  }, () => toast("연결 끊김")));
}
function joinSpace(code, role){
  lsSet("hito.me." + code, role);
  lsSet("hito.joined", JSON.stringify([...new Set([...joinedList(), code])]));
  switchSpace(code);
}
// 6자리 숫자 코드. 이미 있는 코드와 겹치지 않게
function newCode(){
  for (;;){ const n = crypto.getRandomValues(new Uint32Array(1))[0] % 900000 + 100000; if (!SP[n]) return String(n) }
}
function switchSpace(id){
  space = id; lsSet("hito.space", id);
  COLS.forEach(c => S[c] = {});
  if (db) subscribeSpace(); else loadLocal();
  me = lsGet(lsMe());
  go("home");
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const all = col => Object.entries(S[col]).map(([id, v]) => ({ id, ...v }));

// 이 사람의 claude.ai 계정 id (다른 사람과 구분할 수 없는 불투명한 값). 없으면 null
let myId = null;
const myIdReady = (async () => {
  const u = window.claude?.use ? await window.claude.use("user").catch(() => null) : null;
  myId = u ? await u.id().catch(() => null) : null;
})();
async function connect(){
  window.claude?.use?.("sample").then(f => { ai = f; render() }, () => {});
  const c = window.claude?.use ? await window.claude.use("db").catch(() => null) : null;
  if (!c) return;
  db = c; mode = "shared";
  // 서버는 내가 들어간 연결만 돌려준다. 코드로 찾아 둔 남의 연결(아직 새로 연결 전)은 지우지 않고 덮어쓰기만 한다
  db.collection("spaces").onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = d.data() }); SP = { ...SP, ...m }; render();
  }, () => {});
  subscribeSpace();
}

// ---------- who am I ----------
let me = lsGet(lsMe()); // "a" | "b", 연결마다 따로
const other = w => w === "a" ? "b" : "a";
const couple = () => ({ names: { a: "Hana", b: "Sora" }, start: "", kind: "couple", ...(SP[space] || {}) });
// 각자 고르는 테마색. 연결 정보 colors.a / colors.b 에 저장하고 --a / --b 를 덮어쓴다
const COLORS = [["#e2457f", "핑크"], ["#e0503c", "빨강"], ["#8a5cf0", "보라"], ["#2f7fe0", "파랑"], ["#1fa9b8", "하늘"], ["#2a9d5c", "초록"]];
function applyColors(){
  const r = document.documentElement.style, c = SP[space]?.colors || {};
  ["a", "b"].forEach(w => {
    if (c[w]){ r.setProperty("--" + w, c[w]); r.setProperty("--" + w + "-soft", `color-mix(in srgb, ${c[w]} 14%, var(--bg))`) }
    else { r.removeProperty("--" + w); r.removeProperty("--" + w + "-soft") }
  });
}
const swatches = (sel, taken) => `<div class="swatches">${COLORS.map(([hex, label]) =>
  `<button data-color="${hex}" aria-label="${label}" aria-pressed="${sel === hex}" ${hex === taken ? "disabled" : ""} style="--c:${hex}"></button>`).join("")}</div>`;
// 상대가 아직 코드를 넣지 않았으면 true
const waiting = () => !!SP[space] && !SP[space].joined?.[other(me)];
const isFriend = () => couple().kind === "friend";
const loveWord = () => isFriend() ? "얼마나 아끼는지" : "얼마나 사랑하는지";
const startWord = () => isFriend() ? "친구 된 날" : "사귄 날";
const nameOf = w => couple().names[w] || (w === "a" ? "A" : "B");
const av = w => `<span class="av ${w}" aria-hidden="true">${esc([...nameOf(w)][0] || "")}</span>`;

// ---------- helpers ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}` };
const compact = s => s.slice(2).replace(/-/g, ""); // 2026-08-19 -> 260819
const WD = ["일", "월", "화", "수", "목", "금", "토"];
function dday(){
  const s = couple().start; if (!s) return "";
  const t = new Date(ymd(new Date())), st = new Date(s);
  return "D+" + (Math.floor((t - st) / 864e5) + 1);
}
function media(o, alt){
  if (o.photo) return `<img src="${o.photo}" alt="${alt || "올린 사진"}">`;
  const n = PLACEHOLDERS[[...String(o.id)].reduce((a, c) => a + c.charCodeAt(0), 0) % PLACEHOLDERS.length];
  return `<div class="ph ${o.who}" role="img" aria-label="기본 그림"><svg viewBox="0 0 24 24">${ICON[n]}</svg></div>`;
}
let toastT;
function toast(msg){
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.append(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}
// 폰 원본(수십 MB)을 data URL로 통째 읽으면 안드로이드에서 메모리가 터진다 → 비트맵으로 바로 줄인다
async function decode(file){
  if (window.createImageBitmap) try { return await createImageBitmap(file, { imageOrientation: "from-image" }) } catch {}
  const url = URL.createObjectURL(file);
  try { return await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = url }) }
  finally { setTimeout(() => URL.revokeObjectURL(url), 0) }
}
async function shrink(file, max = 640){
  const img = await decode(file), w = img.width, h = img.height;
  const k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); img.close?.();
  return c.toDataURL("image/jpeg", .72);
}
function armDelete(btn, onConfirm){
  if (btn.dataset.armed) return onConfirm();
  btn.dataset.armed = 1; btn.textContent = "한 번 더 누르면 지워져요"; btn.classList.add("danger");
}
const empty = (icon, big, text, action = "") => `<div class="empty"><span class="ic">${svg(icon)}</span><span class="big">${big}</span>${text ? `<span>${text}</span>` : ""}${action}</div>`;

// ---------- router ----------
let route = { name: "home" };
let draft = {}; // in-progress form values per screen
function go(name, params = {}){ route = { name, ...params }; draft = {}; render(true); document.getElementById("view").scrollTop = 0 }
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go);
});

let pending = false, claimed = null;
function render(force){
  const ae = document.activeElement;
  if (!force && ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && ae.type !== "range") { pending = true; return }
  pending = false;
  applyColors();
  if (space && me && myId && SP[space]?.joined?.[me] === true && claimed !== space){ claimed = space; putSpace(space, { ...SP[space], joined: { ...SP[space].joined, [me]: myId } }) }
  // 초대 링크로 들어왔으면 db가 준비된 뒤 그 코드를 찾는 화면으로 (이미 그 연결 안이면 그냥 둔다)
  const inv = lsGet("hito.invite");
  if (inv && (db || !window.claude?.use)){
    try { localStorage.removeItem("hito.invite") } catch {}
    if (inv !== space){ route = { name: space && me ? "pair" : "home", backTo: "home" }; draft = { pm: "join", code: inv, auto: true } }
  }
  // 연결이 없으면 어느 탭이든 홈(초대하기 / 코드 입력)으로
  if (!space || !me) route = { name: "home" };
  const v = VIEWS[route.name] || VIEWS.home;
  const out = v();
  renderTop(out.title, out.action);
  const view = document.getElementById("view");
  view.innerHTML = out.html;
  out.bind?.(view);
  const tab = { day: "diary", entry: "diary" }[route.name] || route.name;
  document.querySelectorAll("#tabs [data-go]").forEach(b => b.setAttribute("aria-current", String(b.dataset.go === tab)));
}
document.addEventListener("focusout", () => setTimeout(() => { if (pending) render() }, 0));

function renderTop(title, action){
  const top = document.getElementById("top");
  const hearts = heartBalance();
  const left = route.name === "home"
    ? `<button class="iconbtn" data-menu aria-label="설정">${svg("gear")}</button>
       <h1 class="logo">${LOGO}</h1>`
    : `<button class="iconbtn" data-back aria-label="뒤로">${svg("back")}</button><h1>${title || ""}</h1>`;
  const dd = space && me ? dday() : "";
  top.innerHTML = `${left}${action ? `<button class="iconbtn" data-action aria-label="${action.label}">${svg(action.icon)}</button>` : ""}${dd ? `<span class="dday">${dd}</span>` : ""}<span class="hearts" title="내 하트 점수"><svg viewBox="0 0 24 24">${ICON.heart}</svg>${hearts}</span>`;
  top.querySelector("[data-back]")?.addEventListener("click", () => go(route.backTo || "home", route.backParams || {}));
  top.querySelector("[data-menu]")?.addEventListener("click", () => go("settings"));

}

// 함께 설정
// 1) 초대하기: 관계를 고르고 코드를 만든다 (나 = a). 코드 입력: 상대가 만든 코드를 넣는다.
// 2) 코드를 넣으면: 내 계정이 이미 들어간 코드면 그 자리로 바로 들어가고, 아니면 빈자리가 있을 때만 "새로 연결"(나 = b).
//    자리 주인은 joined.a / joined.b 에 둔 계정 id 로 가린다 — 다른 계정은 남의 자리로 들어갈 수 없다.
// 3) 연결된 뒤 내 이름이 없으면 홈에서 이름·색을 정한다 (setupHTML).
const ownsSeat = (sp, w) => !!sp?.joined?.[w] && (sp.joined[w] === myId || (sp.joined[w] === true && !myId));
const mySeat = sp => ["a", "b"].find(w => ownsSeat(sp, w));
const segOf = (key, val, opts) => `<div class="seg">${opts.map(([k, l]) => `<button data-${key}="${k}" aria-pressed="${val === k}">${l}</button>`).join("")}</div>`;
function pairHTML(){
  draft.pm ??= "make"; draft.pk ??= "couple";
  const code = draft.found, sp = code && SP[code];
  // 코드를 넣었는데 내 자리가 없고 빈자리도 없으면 들어갈 수 없다. 빈자리가 있으면 새로 연결만
  if (sp) return { html: `<div class="welcome">
      ${sp.names?.a ? `<span class="muted">${esc(sp.names.a)}님의 초대</span>` : ""}
      <span class="pair-code" style="padding-top:0">${code.slice(0, 3)} ${code.slice(3)}</span>
      ${sp.joined?.b ? `<span class="muted">이미 연결된 코드</span>` : `<button class="btn primary" id="p-new">새로 연결</button>`}
      <button class="textbtn" id="p-back" style="align-self:flex-start">다른 코드</button></div>`,
    bind: v => {
      v.querySelector("#p-new")?.addEventListener("click", async () => {
        if (!await putSpace(code, { ...sp, joined: { ...sp.joined, b: myId || true } })) return;
        draft = {}; joinSpace(code, "b") });
      v.querySelector("#p-back").onclick = () => { draft = { pm: "join" }; render(true) };
    }};
  // 이 계정이 이미 들어가 있는 연결 (다른 기기에서 만든 것 포함)
  const mine = myId ? Object.keys(SP).filter(id => mySeat(SP[id])) : [];
  return { html: `<div class="welcome">
    ${mine.map(id => { const sp = SP[id], w = mySeat(sp);
      return `<button class="btn" data-enter="${id}" style="align-self:flex-start"><span style="color:${sp.colors?.a || "var(--a)"}">${esc(sp.names?.a || "")}</span>&nbsp;&amp;&nbsp;<span style="color:${sp.colors?.b || "var(--b)"}">${esc(sp.names?.b || "")}</span>&nbsp;들어가기</button>` }).join("")}
    ${segOf("pm", draft.pm, [["make", "초대하기"], ["join", "코드 입력"]])}
    ${draft.pm === "make" ? segOf("pk", draft.pk, KINDS)
      : `<input type="text" id="p-code" inputmode="numeric" maxlength="7" placeholder="코드" aria-label="코드" value="${esc(draft.code || "")}" style="font-size:24px;letter-spacing:.2em">`}
    <button class="btn primary" id="p-go">${draft.pm === "make" ? "코드 만들기" : "연결"}</button>
    ${logoutHTML()}</div>`,
  bind: v => {
    const keep = () => { const c = v.querySelector("#p-code"); if (c) draft.code = c.value };
    v.querySelectorAll("[data-pm]").forEach(b => b.onclick = () => { keep(); draft.pm = b.dataset.pm; render(true) });
    v.querySelectorAll("[data-pk]").forEach(b => b.onclick = () => { draft.pk = b.dataset.pk; render(true) });
    v.querySelectorAll("[data-enter]").forEach(b => b.onclick = () => { const id = b.dataset.enter; draft = {}; joinSpace(id, mySeat(SP[id])) });
    const go_ = async () => {
      keep(); await myIdReady;
      if (draft.pm === "make"){
        const code = newCode();
        if (!await putSpace(code, { names: { a: "", b: "" }, colors: {}, kind: draft.pk, start: "", ts: Date.now(), joined: { a: myId || true } })) return;
        draft = {}; joinSpace(code, "a"); return;
      }
      const code = (draft.code || "").replace(/\D/g, "");
      if (!SP[code] && db){ const d = (await db.collection("spaces").doc(code).get().catch(() => null))?.data?.(); if (d) SP = { ...SP, [code]: d } }
      if (!SP[code]) { toast("코드 없음"); return }
      // 내 계정이 이미 들어가 있는 코드면 그 자리로 바로 들어간다
      const seat = mySeat(SP[code]);
      if (seat) { draft = {}; joinSpace(code, seat); return }
      draft = { pm: "join", found: code }; render(true);
    };
    v.querySelector("#p-go").onclick = go_;
    if (draft.auto){ delete draft.auto; go_() }
    bindLogout(v);
    v.querySelector("#p-code")?.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) go_() });
  }};
}
// 앱 버전(hito-app)에만 로그인이 있다. claude.ai 에서는 window.hitoApp 이 없어 버튼도 없다
const logoutHTML = () => window.hitoApp ? `<button class="textbtn" id="logout" style="align-self:flex-start">로그아웃</button>` : "";
const PUSH_LABEL = { on: "알림 켜짐", off: "알림 켜기", denied: "알림 꺼짐 · 폰 설정에서 허용", unsupported: "알림 · 홈 화면에 추가한 뒤 켜기", error: "알림 다시 시도" };
const pushHTML = () => { const p = window.hitoApp?.push; return p ? `<button class="textbtn" id="push" style="align-self:flex-start" ${p.state === "on" ? "disabled" : ""}>${PUSH_LABEL[p.state] || PUSH_LABEL.off}</button>` : "" };
function bindPush(v){
  const b = v.querySelector("#push"); if (!b) return;
  b.onclick = async () => { b.disabled = true; const s = await window.hitoApp.push.enable(); if (s === "error") toast("알림을 켜지 못했어요"); render(true) };
}
function bindLogout(v){
  const b = v.querySelector("#logout"); if (!b) return;
  b.onclick = () => {
    if (!b.dataset.armed){ b.dataset.armed = 1; b.textContent = "한 번 더 누르면 로그아웃"; b.classList.add("danger"); return }
    window.hitoApp.signOut();
  };
}
// 연결 뒤 처음: 내 이름과 내 색 (상대가 고른 색은 막는다)
function setupHTML(){
  const sp = SP[space], taken = sp.colors?.[other(me)];
  if (!draft.pc || draft.pc === taken) draft.pc = sp.colors?.[me] && sp.colors[me] !== taken ? sp.colors[me] : COLORS.find(([h]) => h !== taken)[0];
  return { html: `<div class="welcome">
    <input type="text" id="p-name" placeholder="내 이름" aria-label="내 이름" value="${esc(draft.pname || "")}" style="color:${draft.pc};font-size:20px">
    ${swatches(draft.pc, taken)}
    <button class="btn primary" id="p-save">시작</button></div>`,
  bind: v => {
    v.querySelectorAll("[data-color]").forEach(b => b.onclick = () => { draft.pname = v.querySelector("#p-name").value; draft.pc = b.dataset.color; render(true) });
    const save = async () => {
      const name = v.querySelector("#p-name").value.trim(); if (!name) { toast("이름 없음"); return v.querySelector("#p-name").focus() }
      const cur = SP[space];
      if (draft.pc === cur.colors?.[other(me)]) { toast("상대와 같은 색"); return }
      if (await putSpace(space, { ...cur, names: { ...cur.names, [me]: name }, colors: { ...(cur.colors || {}), [me]: draft.pc } })) draft = {};
    };
    v.querySelector("#p-save").onclick = save;
    v.querySelector("#p-name").onkeydown = e => { if (e.key === "Enter" && !e.isComposing) save() };
  }};
}

// 초대 보내기: 앱 버전(hito-app)은 웹 주소에 코드를 붙인 링크를, claude.ai 버전은 코드만 보낸다.
// 공유 창이 없으면(안드로이드 앱 등) 클립보드에 복사한다
const INVITE_BASE = "https://mnizom.github.io/hito/";
async function sendInvite(code){
  const url = window.hitoApp ? `${INVITE_BASE}?join=${code}` : "", text = `HiTo에서 같이 써요 · 연결 코드 ${code}`;
  if (navigator.share){ try { await navigator.share(url ? { text, url } : { text }); return } catch (e){ if (e?.name === "AbortError") return } }
  navigator.clipboard.writeText(url ? `${text}\n${url}` : text).then(() => toast(url ? "링크 복사 · 카톡에 붙여 넣어 주세요" : "복사"), () => toast(url || code));
}

// ---------- screens ----------
const VIEWS = {};
VIEWS.pair = () => ({ title: "새 연결", ...pairHTML() });

// 홈: 상대의 가장 최근 상황 하나만
VIEWS.home = () => {
  if (!space || !me) return pairHTML();
  if (SP[space] && !SP[space].names?.[me]) return setupHTML();
  if (waiting()) return { html: `<div class="welcome" style="align-items:center;text-align:center">
      <span class="pair-code">${space.slice(0, 3)} ${space.slice(3)}</span>
      <button class="btn primary" id="send-code">${window.hitoApp ? "링크 보내기" : "보내기"}</button>
      <button class="textbtn" id="copy-code">코드만 복사</button></div>`,
    bind: v => {
      v.querySelector("#send-code").onclick = () => sendInvite(space);
      v.querySelector("#copy-code").onclick = () => navigator.clipboard.writeText(space).then(() => toast("복사"), () => toast(space));
    }};
  const o = other(me);
  const latest = all("posts").filter(p => p.who === o).sort((x, y) => y.ts - x.ts)[0];
  const html = latest ? postHTML(latest)
    : empty("image", "아직 없음", "");
  return { html, bind: v => {
    v.querySelector("[data-go-compose]")?.addEventListener("click", () => go("compose"));
    bindPosts(v);
  }};
};

// 속마음은 쓴 사람만 보고, 상대는 기록 화면에서 ♥를 써서 열람한 뒤에만 본다
// (홈에서는 속마음이 있는지조차 드러내지 않는다)
function postHTML(p){
  const replies = (p.replies || []).map(r => `<div class="reply ${r.who}">${esc(r.text)}</div>`).join("");
  const liked = p.likes?.[me];
  const theirs = p.who !== me;
  // 하트는 사진 바로 밑. 상대 글이면 누를 수 있고, 내 글이면 상대가 눌렀는지만 보인다
  const like = theirs
    ? `<button class="like ${liked ? "on" : ""}" data-like="${p.id}" aria-pressed="${!!liked}" aria-label="하트">${svg("heart")}</button>`
    : Object.values(p.likes || {}).some(Boolean) ? `<span class="like on" aria-label="하트 받음">${svg("heart")}</span>` : "";
  return `<article class="post card" id="p-${p.id}">
    <div class="head"><b class="who-${p.who}">${esc(nameOf(p.who))}</b><time>${hm(p.ts)}</time></div>
    <div class="media">${media(p)}</div>
    ${like ? `<div class="actions">${like}</div>` : ""}
    <div class="voice">${esc(p.text)}</div>
    ${replies}
    <div class="actions">
      ${theirs ? `<label class="inline"><input type="text" id="r-${p.id}" placeholder="" aria-label="한마디 남기기"><button class="send" data-reply="${p.id}" aria-label="남기기">${svg("send")}</button></label>`
      : `<span style="flex:1"></span><button class="textbtn" data-delpost="${p.id}">지우기</button>`}
    </div></article>`;
}
function bindPosts(v){
  v.querySelectorAll("[data-like]").forEach(b => b.onclick = () => {
    const p = S.posts[b.dataset.like]; put("posts", b.dataset.like, { ...p, likes: { ...(p.likes || {}), [me]: !p.likes?.[me] } });
  });
  const send = id => {
    const inp = v.querySelector("#r-" + id), t = inp.value.trim(); if (!t) return inp.focus();
    inp.value = ""; inp.blur();
    const p = S.posts[id]; put("posts", id, { ...p, replies: [...(p.replies || []), { who: me, text: t, ts: Date.now() }] });
  };
  v.querySelectorAll("[data-reply]").forEach(b => b.onclick = e => { e.preventDefault(); send(b.dataset.reply) });
  v.querySelectorAll("input[id^='r-']").forEach(i => i.onkeydown = e => { if (e.key === "Enter" && !e.isComposing) send(i.id.slice(2)) });
  v.querySelectorAll("[data-delpost]").forEach(b => b.onclick = () => armDelete(b, () => del("posts", b.dataset.delpost)));
}

    <label class="media pick">
      ${draft.photo ? `<img src="${draft.photo}" alt="고른 사진" style="position:absolute;inset:0">` : `${svg("image")}<span>사진</span>`}

    </label>
    <div class="line"><svg viewBox="0 0 24 24" style="color:var(--${me})">${ICON.heart}</svg><textarea id="c-text" rows="1" aria-label="한마디">${esc(draft.text || "")}</textarea></div>
    <div class="line"><svg viewBox="0 0 24 24" style="color:var(--ink-2)">${ICON.heart}</svg><textarea id="c-secret" rows="1" aria-label="속마음">${esc(draft.secret || "")}</textarea></div>
    <button class="btn primary" id="c-post" style="align-self:flex-end">${esc(nameOf(other(me)))}에게 보여 주기</button>`,
  bind: v => {
    v.querySelector("#c-photo").onchange = async e => { const f = e.target.files[0]; if (!f) return;
      try { draft.text = v.querySelector("#c-text").value; draft.secret = v.querySelector("#c-secret").value; draft.photo = await shrink(f); render(true) }
      catch { toast(/hei[cf]/i.test(f.type + f.name) ? "HEIC 사진은 못 열어요 · 카메라 설정에서 '고효율 사진'을 꺼 주세요" : "열 수 없는 사진") }
      e.target.value = "" };
    // 줄이 늘어나면 칸도 같이 늘어난다
    const grow = t => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px" };
    v.querySelectorAll(".line textarea").forEach(grow);
    v.querySelector("#c-text").oninput = e => { draft.text = e.target.value; grow(e.target) };
    v.querySelector("#c-secret").oninput = e => { draft.secret = e.target.value; grow(e.target) };
    v.querySelector("#c-post").onclick = () => {
      const text = (draft.text || "").trim(); if (!text) { toast("한마디 없음"); return v.querySelector("#c-text").focus() }
      if (all("posts").filter(p => p.who === me && postDate(p) === ymd(new Date())).length >= DAILY_LIMIT) { toast(`${DAILY_LIMIT}/${DAILY_LIMIT}`); return }
      put("posts", uid(), { who: me, ts: Date.now(), text, secret: (draft.secret || "").trim(), photo: draft.photo || null,
        likes: {}, replies: [] });
      toast("올림"); go("home");
    };
  }};
};

// 상대의 속마음(상황 속마음 · 받은 질문의 속마음 답)을 하나 열 때마다 −1
const HEART_COST = 1;
function heartBalance(){
  const answered = all("daily").filter(d => d.who === me).reduce((n, d) => n + (d.qs || []).filter(q => (q.a || "").trim()).length, 0);
  const liked = Object.values(S.posts).filter(p => p.who === me && p.likes?.[other(me)]).length;
  const spent = Object.values(S.posts).filter(d => d.unlockedBy === me).length + all("aiq").filter(q => q.unlockedBy === me).length;
  return answered + liked - spent * HEART_COST;
}
const canSpend = () => heartBalance() >= HEART_COST;

  ["전 연애", "연인", "전 연애가 있다면 헤어진 이유를 알려 주세요. 여러 번이면 줄을 바꿔 써 주세요. 없으면 \"없음\"이라고 써 주세요.", ["내가 보는 이유", "상대가 말한 이유 (선택)"]],
  ["전 연애에서 배운 교훈", "연인", "전 연애들에서 배운 교훈은 무엇인가요? 없으면 \"없음\"이라고 써 주세요.", ["교훈"]],
];
const baseList = () => BASE_Q.filter(q => !(isFriend() && q[1] === "연인"));
const SENSITIVE = name => /아픔|아픈|전 연애/.test(name);
const optional = f => typeof f === "string" && f.includes("(선택)");
const filled = v => Array.isArray(v) ? v.length > 0 : !!String(v ?? "").trim();
const fieldName = f => typeof f === "string" ? f.replace(/ \(선택\)$/, "") : f.l;
const baseDoc = w => S.base[w] || { who: w, ans: {} };
const isAnswered = (a, q) => !!a && (!!a.no || q[3].every((f, i) => optional(f) || filled(a.f?.[i])));
// 패스한 문제는 맨 뒤로 가고, 다시 답할 때까지 진행 수에 들어가지 않는다 (base/<사람>.pass = 패스한 순서)
const passed = w => baseDoc(w).pass || [];
const baseOrder = w => { const p = passed(w), list = baseList(); return [...list.filter(q => !p.includes(q[0])), ...p.map(k => list.find(q => q[0] === k)).filter(Boolean)] };
const baseCount = w => baseList().filter(q => isAnswered(baseDoc(w).ans?.[q[0]], q) && !passed(w).includes(q[0])).length;
const baseDone = w => !!S.base[w]?.done;
const opened = () => baseDone("a") && baseDone("b");
// 정리에 넘기는 한 줄: 「칸 이름: 값」을 / 로 잇는다
const baseText = (a, q) => q[3].map((f, i) => { const v = a.f?.[i]; if (!filled(v)) return "";
  const val = Array.isArray(v) ? v.join(", ") : String(v).trim(), n = fieldName(f); return n ? `${n}: ${val}` : val }).filter(Boolean).join(" / ");
function saveBaseAns(key, a){
  const d = baseDoc(me), q = baseList().find(x => x[0] === key);
  // 패스했던 문제에 다 답하면 패스에서 뺀다
  const pass = q && isAnswered(a, q) ? (d.pass || []).filter(k => k !== key) : d.pass;
  put("base", me, { ...d, who: me, ans: { ...(d.ans || {}), [key]: { ...a, ts: Date.now() } }, ...(pass ? { pass } : {}) });
}
// 쓰는 중인 줄글은 draft.bt[질문][칸] 에 두었다가 넘기거나 칸을 벗어날 때 저장한다
function flushBase(){
  const bt = draft.bt || {}; draft.bt = {};
  Object.entries(bt).forEach(([key, fs]) => { const a = baseDoc(me).ans?.[key] || {}, f = [...(a.f || [])]; let changed = false;
    Object.entries(fs).forEach(([i, t]) => { if ((f[i] || "") !== t){ f[i] = t; changed = true } });
    if (changed) saveBaseAns(key, { ...a, no: false, f }) });
}
// 한 번에 한 문제. 처음 열면 아직 안 한 첫 문제로
const baseAt = () => { const list = baseOrder(me); return Math.max(0, Math.min(draft.bi ?? 0, list.length - 1)) };
const firstOpen = () => baseOrder(me).findIndex(q => !isAnswered(baseDoc(me).ans?.[q[0]], q) || passed(me).includes(q[0]));
function baseHTML(){
  const list = baseOrder(me), total = list.length, d = baseDoc(me);
  draft.bi ??= Math.max(0, firstOpen());
  const i = baseAt(), [key, grp, ask, fields] = list[i], a = d.ans?.[key] || {};
  const field = (f, fi) => typeof f === "string"
    ? `<label class="bf"><span class="small muted">${esc(f)}</span>
        <textarea class="short" rows="1" data-t="${fi}" aria-label="${esc(f)}">${esc(draft.bt?.[key]?.[fi] ?? a.f?.[fi] ?? "")}</textarea></label>`
    : `<div class="bf">${f.l ? `<span class="small muted">${esc(f.l)}</span>` : ""}<div class="chips">${f.o.map(o => {
        const sel = a.f?.[fi], on = f.m ? (sel || []).includes(o) : sel === o;
        return `<button data-pick="${fi}" data-v="${esc(o)}" aria-pressed="${on}">${f.m && on ? `<i>${sel.indexOf(o) + 1}</i>` : ""}${esc(o)}</button>` }).join("")}</div></div>`;
  return `<div class="welcome" style="padding-top:8px">
    <span class="small muted">${esc(grp)} · ${baseCount(me)}/${total}</span>
    <h2 class="bask">${esc(ask)}</h2>
    ${fields.map(field).join("")}
    <div class="bq-row">${SENSITIVE(key) ? `<button class="textbtn" data-no aria-pressed="${!!a.no}">${a.no ? "✓ " : ""}말하고 싶지 않음</button>` : "<span></span>"}
      <button class="textbtn" data-open aria-pressed="${!!a.open}">${a.open ? "상대에게 그대로 보여도 됨" : "속마음"}</button></div>
    <div class="bq-row"><button class="btn" id="bp-prev" ${i ? "" : "disabled"}>이전</button>
      <button class="textbtn" id="bp-pass">패스</button>
      ${i < total - 1 ? `<button class="btn primary" id="bp-next">다음</button>` : `<button class="btn primary" id="bp-done">끝내기</button>`}</div>
  </div>`;
}
function bindBase(v){
  const list = baseOrder(me), i = baseAt(), [key, , , fields] = list[i];
  const cur = () => baseDoc(me).ans?.[key] || {};
  v.querySelectorAll("[data-t]").forEach(t => { const fi = t.dataset.t;
    const grow = () => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px" }; grow();
    t.oninput = () => { ((draft.bt ||= {})[key] ||= {})[fi] = t.value; grow() };
    t.onblur = () => setTimeout(flushBase, 250) });
  v.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
    flushBase(); const fi = +b.dataset.pick, o = b.dataset.v, a = cur(), f = [...(a.f || [])];
    if (fields[fi].m){ const s = f[fi] || []; f[fi] = s.includes(o) ? s.filter(x => x !== o) : [...s, o] } else f[fi] = f[fi] === o ? "" : o;
    saveBaseAns(key, { ...a, no: false, f }) });
  v.querySelector("[data-no]")?.addEventListener("click", () => { flushBase(); const a = cur(); saveBaseAns(key, { ...a, no: !a.no }) });
  v.querySelector("[data-open]").onclick = () => { flushBase(); const a = cur(); saveBaseAns(key, { ...a, open: !a.open }) };
  const flip = k => { flushBase(); draft.bi = i + k; render(true); document.getElementById("view").scrollTop = 0 };
  v.querySelector("#bp-prev")?.addEventListener("click", () => flip(-1));
  v.querySelector("#bp-next")?.addEventListener("click", () => flip(1));
  // 패스: 이 문제를 맨 뒤로 보낸다. 같은 자리(i)에 다음 문제가 온다
  v.querySelector("#bp-pass").onclick = () => { flushBase(); const d = baseDoc(me);
    put("base", me, { ...d, who: me, pass: [...(d.pass || []).filter(k => k !== key), key] }); render(true); document.getElementById("view").scrollTop = 0 };
  v.querySelector("#bp-done")?.addEventListener("click", () => {
    flushBase();
    const open = baseOrder(me).filter(q => !isAnswered(baseDoc(me).ans?.[q[0]], q) || passed(me).includes(q[0]));
    if (open.length){ toast(`${open.length}개 남음`); draft.bi = firstOpen(); render(true); return }
    put("base", me, { ...baseDoc(me), who: me, done: Date.now() }); toast("다 답했어요");
  });
}

// ---------- 정리 · 질문 만들기 · 리포트: Claude를 부르는 곳 ----------
// Claude는 이 페이지에서 직접 부른다 (claude.use("sample") / 앱은 supabase claude 함수). 없으면 아무것도 하지 않는다.
// ? 탭 · 우리 탭을 열 때 autoAI 가 ① 마지막 정리(meta/ai.cut) 뒤의 답 · 글을 정리하고 ② 오늘 질문이 없으면 만들고 ③ 첫 리포트가 없으면 쓴다.
let ai = null, aiState = "";
const DAY = 864e5;
const aiCut = () => S.meta.ai?.cut || 0;
const tag = w => `${w}(${nameOf(w)})`;
const people = () => `a = ${nameOf("a")}, b = ${nameOf("b")} (${isFriend() ? "친구" : "연인"} 사이)`;
const md_ = ts => { const d = new Date(ts); return `${pad(d.getMonth() + 1)}.${pad(d.getDate())}` };
// 마지막 정리 뒤에 생긴 답 · 글. 속마음 출처는 (속마음)으로 표시한다
function pendingItems(){
  const c = aiCut(), out = [];
  const push = (ts, line, secret) => out.push({ ts, line: `${secret ? "(속마음) " : ""}${line}` });
  ["a", "b"].forEach(w => { const d = S.base[w]; if (!d) return;
    baseList().forEach(q => { const a = d.ans?.[q[0]];
      if (isAnswered(a, q) && a.ts > c && !a.no) push(a.ts, `${tag(w)}의 기본 질문 답 · 「${q[2]}」 ${baseText(a, q)}`, !a.open) }) });
  all("daily").forEach(d => (d.qs || []).forEach(q => { if (!q.a || !(q.ats > c)) return;
    const kind = q.from ? `${tag(q.from)}이(가) 직접 물은 질문` : q.k === "other" ? `${tag(other(d.who))}에 대해 묻는 질문` : q.k === "rel" ? "관계 질문" : "내 질문";
    push(q.ats, `${tag(d.who)}의 오늘 질문 답 · ${kind} 「${q.q}」: ${q.a}`, q.k === "rel" ? false : q.from ? q.share === "secret" : true) }));
  all("posts").forEach(p => {
    if (p.ts > c){
      if ((p.text || "").trim()) push(p.ts, `${tag(p.who)}의 한마디: ${p.text}`, false);
      if ((p.secret || "").trim()) push(p.ts, `${tag(p.who)}의 속마음: ${p.secret}`, true);
    }
    (p.replies || []).forEach(r => r.ts > c && push(r.ts, `${tag(r.who)}가 ${tag(p.who)}의 한마디 「${p.text}」에 단 말: ${r.text}`, false));
  });
  return out.sort((x, y) => x.ts - y.ts);
}
// 속마음 출처 모듈러는 쓴 사람에게만 원문(명제), 다른 사람이 읽는 자료에는 큰 바람 한 줄만 (5장 — 코드가 지킨다)
// viewer = 그 자료를 읽을 사람. null 이면 두 사람이 함께 읽는 자료(속마음은 모두 큰 바람)
const viewOf = (m, viewer) => !m.secret || m.who === viewer ? m
  : ("wish" in m ? (m.wish ? { ...m, text: m.wish } : null) : m); // 예전 모듈러는 이미 큰 바람으로 적혀 있다
const modsFor = (viewer, ms = all("mods")) => ms.map(m => viewOf(m, viewer)).filter(Boolean);
// 닻 카드: 닻은 전부(붙은 수와 함께), 닻이 아닌 것은 최근 것만 — 기록이 쌓여도 프롬프트가 늘지 않게 (6장)
function modsLines(ms = all("mods")){
  const under = {}; ms.forEach(m => { if (m.up) under[m.up] = (under[m.up] || 0) + 1 });
  const line = m => `${m.id} | ${md_(m.ts)} | ${m.who}→${m.about} | ${m.anchor ? `닻(붙은 ${under[m.id] || 0}) · ` : ""}${m.up ? `↑${m.up} · ` : ""}${m.desire ? "바람 · " : ""}${m.kind === "가설" ? "가설 · " : ""}${m.open ? "열림 · " : ""}${m.text}`;
  const anchors = ms.filter(m => m.anchor), rest = ms.filter(m => !m.anchor).sort((x, y) => x.ts - y.ts).slice(-150);
  return [...anchors.sort((x, y) => x.ts - y.ts), ...rest].map(line).join("\n") || "(아직 없음)";
}
const RULES = () => `너는 커플 앱에서 두 사람의 답과 글을 「모듈러」로 정리한다. ${people()}.
모듈러 = 단독으로 참·거짓이 갈리는 한 줄 명제. 기호·날짜 머리말·「그걸」 같은 지시어·윗줄에 기대는 문장을 쓰지 않는다.
줄글 답 하나에서 여러 개를 뽑는다. 사건·날짜·그날 한 말은 입구로만 쓰고, 그 밑의 욕망·기준·연결로 올린다.
- 주인: 그 생각을 가진 사람(a 또는 b). 대상: 누구에 대한 것인지(a 또는 b).

// 궁금한 것: 자료로 답하고, 모자라면 상대의 오늘 질문으로 보낼 질문을 만든다
function answerPrompt(w, q){
  const O = nameOf(other(w));
  return `두 사람(${people()})이 남긴 자료가 아래에 있다. ${nameOf(w)}님이 궁금해한다: 「${q}」
${PLAIN(w)}
${SHARED_RULE}
- 묻는 만큼 자세히 답한다.
- 자료로 답할 수 있으면 답한다.
- 자료가 모자라면 "모름"을 true로 하고, 그 빈칸을 채우려고 ${O}님에게 물을 질문 하나를 만든다. 드라이하게, 한 가지만, 줄글로 답할 수 있게, 누가 물었는지 드러나지 않게.
JSON 하나로만 답한다: {"답":"…","모름":false,"물을것":"…"}

[자료]
${modsLines(modsFor(w))}`;
}

const aiErr = e => ({ not_granted: "Claude 사용을 허락하지 않음", sampling_disabled: "Claude를 쓸 수 없는 계정", rate_limited: "잠시 뒤에 다시",
  invalid_json: "결과를 읽지 못함 · 다시 눌러 주세요", prompt_too_large: "기록이 너무 많음", refused: "Claude가 거절함" }[e?.code] || "Claude 오류");
async function runAI(label, fn){
  if (aiState || !ai) return;
  aiState = label; render();
  try { await fn() } catch (e) { if (e?.code !== "cancelled" && e?.code !== "not_granted") toast(aiErr(e)) }
  finally { aiState = ""; render() }
}
const AB = w => w === "a" || w === "b";
const CHUNK = 40; // 한 번에 정리하는 답 · 글 수 (기본 질문은 몇 번에 나눠 정리된다)
async function organizeNow(){
  const pend = pendingItems(); if (!pend.length) return;
  let n = Math.min(CHUNK, pend.length);
  while (n < pend.length && pend[n].ts === pend[n - 1].ts) n++; // 같은 때 생긴 것은 함께
  const items = pend.slice(0, n), cut = n < pend.length ? items.at(-1).ts : Date.now();
  const r = await ai.json(organizePrompt(items), { cache: false, ...LBL("organize") }) || {};
  const now = Date.now(), ids = {};
  (r.추가 || []).forEach(m => { if (m?.명제 && AB(m.주인)) ids[m.임시id || uid()] = uid() });
  (r.추가 || []).forEach(m => { if (!m?.명제 || !AB(m.주인)) return;
    const up = ids[m.붙는닻] || (S.mods[m.붙는닻] ? m.붙는닻 : null);
    put("mods", ids[m.임시id] || uid(), { who: m.주인, about: AB(m.대상) ? m.대상 : m.주인, text: String(m.명제), desire: !!m.욕망, open: !!m.열림,
      anchor: !!m.닻, up, secret: !!m.속마음, wish: m.속마음 ? String(m.큰바람 || "") : "", kind: m.종류 === "가설" ? "가설" : "명제", ts: now }) });
  (r.덮어쓰기 || []).forEach(m => { const cur = S.mods[m?.id]; if (cur && m.명제) put("mods", m.id, { ...cur, text: String(m.명제),
    open: typeof m.열림 === "boolean" ? m.열림 : cur.open, ...(cur.secret && m.큰바람 ? { wish: String(m.큰바람) } : {}), ts: now }) });
  (r.삭제 || []).forEach(id => S.mods[id] && del("mods", id));
  put("meta", "ai", { ...(S.meta.ai || {}), cut, last: { ts: now, by: me, report: String(r.보고 || "") } });
}
async function makeToday(){
  if (todayDoc() || !opened()) return;
  const queued = queuedFor(me), date = ymd(new Date());
  const r = await ai.json(todayPrompt(me, !queued, !relOf(date)), { cache: false, ...LBL("today") }) || {};
  if (todayDoc()) return;
  // 관계 질문은 두 사람이 같은 것을 받는다. 먼저 만든 쪽 것을 쓴다
  const relQ = relOf(date)?.q || String(r.관계 || "").trim();
  if (!relOf(date) && relQ) put("meta", "rel_" + date, { q: relQ, ts: Date.now(), by: me });
  const mine = queued ? { k: "me", q: queued.q, aiqId: queued.id, ...(queued.direct ? { from: queued.by } : {}) } : { k: "me", q: String(r.내 || "").trim() };
  const qs = [mine, { k: "other", q: String(r.상대 || "").trim() }, { k: "rel", q: relQ }].filter(q => q.q);
  if (!qs.length) return;
  put("daily", todayKey(), { who: me, date, qs, ts: Date.now() });
  if (queued){ const { id, ...rest } = queued; put("aiq", id, { ...rest, used: date }) }
}
// 리포트는 버튼을 누를 때마다 새로 쓴다. 나: meta/self_<나>, 상대: meta/about_<나>, 관계: meta/us (두 사람 모두), 첫: meta/first_<나>
const REPORTS = {
  me: () => ({ key: "self_" + me, prompt: selfPrompt(me), label: "report_me" }),
  other: () => ({ key: "about_" + me, prompt: otherPrompt(me), label: "report_other" }),
  us: () => ({ key: "us", prompt: usPrompt(), opts: { modelTier: "complex" }, label: "report_us" }),
  firstMe: () => ({ key: "first_me_" + me, prompt: firstMePrompt(me), opts: { modelTier: "complex" }, label: "report_first_me" }),
  firstUs: () => ({ key: "first_us", prompt: firstUsPrompt(), opts: { modelTier: "complex" }, label: "report_first_us" }),
};
function writeReport(kind){
  return runAI("쓰는 중", async () => {
    for (let i = 0; i < 8 && pendingItems().length; i++) await organizeNow(); // 쌓인 답을 끝까지 정리한 뒤 쓴다
    const r = REPORTS[kind]();
    const { text } = await ai(r.prompt, { cache: false, ...(r.opts || {}), ...LBL(r.label) });
    put("meta", r.key, { text, ts: Date.now(), by: me });
  });
}
// 궁금한 것: 자료로 답하고, 모자라면 상대의 오늘 질문 줄에 질문을 세운다. 그 답이 정리되면 다시 답한다
function answerAsk(id){
  const a = S.asks[id]; if (!a) return;
  return runAI("답 찾는 중…", async () => {
    const r = await ai.json(answerPrompt(me, a.q), { cache: false, ...LBL("ask") }) || {};
    const now = Date.now(), cur = S.asks[id] || a;
    let aiqId = cur.aiq || null;
    if (r.모름 && r.물을것 && !aiqId){ aiqId = uid(); put("aiq", aiqId, { for: other(me), q: String(r.물을것), ts: now, fromAsk: true, by: me }) }
    put("asks", id, { ...cur, a: String(r.답 || ""), ats: now, aiq: aiqId, done: !r.모름 });
  });
}

let lastAuto = 0, tried = {};
async function autoAI(){
  if (!ai || aiState) return;
  if (Date.now() - lastAuto > 10 * 60e3 && pendingItems().length){
    lastAuto = Date.now();
    await runAI("정리하는 중…", async () => { for (let i = 0; i < 6 && pendingItems().length; i++) await organizeNow() });
  }
  // 같은 날 · 같은 일은 한 번만 시도한다 (실패해도 화면을 열 때마다 다시 부르지 않게)
  const date = ymd(new Date());
  if (opened() && !todayDoc() && tried.today !== date){ tried.today = date; await runAI("오늘 질문 만드는 중…", makeToday) }
  // 첫 리포트: 나는 내 질문을 다 마치면, 관계는 두 사람이 다 마치면 (관계는 먼저 연 사람이 한 번 쓴다)
  if (baseDone(me) && !S.meta["first_me_" + me] && !tried.firstMe){ tried.firstMe = 1; await writeReport("firstMe") }
  if (opened() && !S.meta.first_us && !tried.firstUs){ tried.firstUs = 1; await writeReport("firstUs") }
}

// 속마음 글이 있는 상황 (♡ 사랑점수는 글이 아니라 여기서 빠진다)
const hasSecret = d => !!(d.secret || "").trim();
// 속마음은 상대 것이고 아직 열람하지 않았으면 노랗게 가린다
const isLocked = d => d.who !== me && d.unlockedBy !== me;
const dayEntries = date => allEntries().filter(d => d.date === date).sort((x, y) => x.ts - y.ts);

// 가린 글은 내용을 화면에 넣지 않고, 길이만 짐작되는 노란 막대로 그린다
function maskHTML(len){
  const lines = Math.max(1, Math.min(4, Math.ceil(len / 20)));
  return `<div class="mask" role="img" aria-label="가려진 속마음">${Array.from({ length: lines }, (_, i) =>
    `<i style="width:${i === lines - 1 && lines > 1 ? 45 + (len * 7) % 40 : 92 - i * 4}%"></i>`).join("")}</div>`;
}
function textItemHTML({ d, secret }){
  const locked = secret && isLocked(d);
  const text = secret ? d.secret : d.text;
  const body = locked
    ? `${maskHTML(text.length)}${canSpend() ? `<button class="btn accent sm" data-unlock="${d.id}">♥${HEART_COST}로 열람</button>` : ""}`
    : `<div class="voice who-${d.who}${secret ? " inner" : ""}">${esc(text)}<time>${hm(d.ts)}</time></div>`;
  // 이름 없이 글자색으로 누군지, 내 글은 오른쪽 · 상대 글은 왼쪽
  return `<article class="entry ${d.who} ${d.who === me ? "mine" : "theirs"}">
    ${body}${locked ? `<time>${hm(d.ts)}</time>` : ""}</article>`;
}

        : `<p class="small muted" style="margin:0">프로젝트 없음</p>`}
      <div class="addrow"><input type="text" id="p-title" placeholder="프로젝트 이름" aria-label="프로젝트 이름">
        <div class="seg">${[["together", "함께"], ["solo", "개별"]].map(([k, l]) => `<button data-pmode="${k}" aria-pressed="${draft.pmode === k}">${l}</button>`).join("")}</div>
        <button class="btn sm primary" id="p-add">만들기</button></div>
    </section>`,
  bind: v => {
    v.querySelector("#e-date").onchange = e => draft.edate = e.target.value;
    v.querySelectorAll("[data-ewho]").forEach(b => b.onclick = () => { draft.ewho = b.dataset.ewho; const t = v.querySelector("#e-title").value; render(true); document.querySelector("#e-title").value = t });
    v.querySelector("#e-add").onclick = () => { const t = v.querySelector("#e-title").value.trim(); if (!t) return v.querySelector("#e-title").focus();
      v.querySelector("#e-title").blur(); put("events", uid(), { date: v.querySelector("#e-date").value || today, title: t, who: draft.ewho, by: me, ts: Date.now() }) };
    v.querySelectorAll("[data-delev]").forEach(b => b.onclick = () => del("events", b.dataset.delev));
    v.querySelectorAll("[data-pmode]").forEach(b => b.onclick = () => { draft.pmode = b.dataset.pmode; const t = v.querySelector("#p-title").value; render(true); document.querySelector("#p-title").value = t });
    v.querySelector("#p-add").onclick = () => { const t = v.querySelector("#p-title").value.trim(); if (!t) return v.querySelector("#p-title").focus();
      v.querySelector("#p-title").blur(); put("projects", uid(), { title: t, mode: draft.pmode, owner: me, items: [], ts: Date.now() }) };
    v.querySelectorAll("[data-tog]").forEach(b => b.onclick = () => { const [id, i] = b.dataset.tog.split(":"); const p = S.projects[id];
      put("projects", id, { ...p, items: p.items.map((it, j) => j === +i ? { ...it, done: !it.done } : it) }) });
    v.querySelectorAll("[data-additem]").forEach(b => b.onclick = e => { e.preventDefault(); const id = b.dataset.additem, inp = v.querySelector("#pi-" + id), t = inp.value.trim(); if (!t) return inp.focus();
      inp.blur(); const p = S.projects[id]; put("projects", id, { ...p, items: [...(p.items || []), { t, done: false }] }) });
    v.querySelectorAll("[data-delproj]").forEach(b => b.onclick = () => armDelete(b, () => del("projects", b.dataset.delproj)));
  }};
};

// 우리 탭: 통계(기분 · 에너지) · 속마음 · 관계
const W = 340, H = 190, L = 30, R = 12, T = 12, B = 26;
function trendChart(series, label){ // series: [{arr, color, key}]
  const pts = series.flatMap(s => s.arr);
  const t0 = Math.min(...pts.map(p => p.ts)), t1 = Math.max(...pts.map(p => p.ts)), span = Math.max(1, t1 - t0);
  const x = ts => L + (W - L - R) * (ts - t0) / span, y = v => T + (H - T - B) * (1 - v / 100);
  const line = ({ arr, color: c, key: k }) => { if (!arr.length) return ""; const pt = p => `${x(p.ts).toFixed(1)},${y(p.mood[k]).toFixed(1)}`;
    return `<path d="${arr.map((p, i) => (i ? "L" : "M") + pt(p)).join("")}${arr.length > 1 ? `L${x(arr.at(-1).ts).toFixed(1)},${y(0)}L${x(arr[0].ts).toFixed(1)},${y(0)}Z` : ""}" fill="var(--${c})" fill-opacity=".08" stroke="none"/>
    <polyline points="${arr.map(pt).join(" ")}" fill="none" stroke="var(--${c})" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${arr.map((p, i) => `<circle cx="${x(p.ts).toFixed(1)}" cy="${y(p.mood[k]).toFixed(1)}" r="${i === arr.length - 1 ? 4.5 : 2.4}" fill="${i === arr.length - 1 ? "var(--surface)" : `var(--${c})`}" stroke="var(--${c})" stroke-width="2"/>`).join("")}` };
  const grid = [0, 50, 100].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--hair)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="10.5" fill="var(--ink-2)">${v}</text>`).join("");
  const md = ts => { const d = new Date(ts); return `${d.getMonth() + 1}.${d.getDate()}` };
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">${grid}
    <text x="${L}" y="${H - 6}" font-size="10.5" fill="var(--ink-2)">${md(t0)}</text><text x="${W - R}" y="${H - 6}" font-size="10.5" text-anchor="end" fill="var(--ink-2)">${md(t1)}</text>
    ${series.map(line).join("")}</svg>`;
}
// 기분 · 에너지 · 사랑 = 오늘 질문 끝에서 하루 한 번 (예전 상황에 붙은 것도 함께 그린다)
const series = (w, k, n = 14) => [...all("daily").filter(d => d.who === w && d.mood?.[k] != null).map(d => ({ ts: d.done || d.ts, mood: d.mood })),
  ...all("posts").filter(p => p.who === w && p.mood?.[k] != null)].sort((x, y) => x.ts - y.ts).slice(-n);
const avgOf = (arr, k) => arr.length ? Math.round(arr.reduce((n, p) => n + p.mood[k], 0) / arr.length) : "–";
function bothTrend(k, ic, label){
  const pa = series("a", k), pb = series("b", k);
  if (!pa.length && !pb.length) return empty("chart", "데이터 없음", "");
  return `<div class="card" style="display:flex;flex-direction:column;gap:12px">
      <span class="lab">${ic} ${label}</span>
      ${trendChart([{ arr: pa, color: "a", key: k }, { arr: pb, color: "b", key: k }], `${label} 변화 그래프`)}
      <div class="legend"><span><i style="background:var(--a)"></i>${esc(nameOf("a"))} 평균 ${avgOf(pa, k)}</span><span><i style="background:var(--b)"></i>${esc(nameOf("b"))} 평균 ${avgOf(pb, k)}</span></div>
    </div>`;
}
function oneTrend(w, k, ic, label){
  const arr = series(w, k);
  return `<div class="card" style="display:flex;flex-direction:column;gap:12px">
      <span class="lab">${ic} ${label}</span>
      ${arr.length ? `${trendChart([{ arr, color: w, key: k }], `${label} 변화 그래프`)}<span class="small muted">평균 ${avgOf(arr, k)}</span>`
        : `<span class="small muted">데이터 없음</span>`}
    </div>`;
}
function myLoveTrend(){
  const mine = series(me, "love");
  return `<div class="card" style="display:flex;flex-direction:column;gap:12px">
      <span class="lab" style="display:flex;gap:6px;align-items:center">${svg("lock")}내 마음</span>
      ${mine.length ? `${trendChart([{ arr: mine, color: me, key: "love" }], "내 마음 변화")}
      <span class="small muted">최근 ${mine.at(-1).mood.love} · 평균 ${avgOf(mine, "love")}</span>`
      : `<span class="small muted">데이터 없음</span>`}
    </div>`;
}
// 리포트 + 궁금한 것(asks). 두 사람이 기본 질문을 마치기 전에는 잠긴다.
// 궁금한 것 중 상대의 오늘 질문으로 물어본 것은, 상대가 답하고 정리된 뒤 이 화면을 열면 다시 답한다.
const reportOpen = kind => kind === "me" ? baseDone(me) : opened();
function reportHTML(kind){
  if (!reportOpen(kind)) return `<section style="margin-top:8px"><span class="small muted">${kind === "me"
    ? `? 탭의 질문에 다 답하면 나 리포트가 나와요 · ${baseCount(me)}/${baseList().length}`
    : `두 사람이 ? 탭의 질문에 다 답하면 리포트가 열려요 · 나 ${baseCount(me)}/${baseList().length} · ${esc(nameOf(other(me)))} ${baseCount(other(me))}/${baseList().length}`}</span></section>`;
  const key = { me: "self_" + me, other: "about_" + me, us: "us" }[kind], rp = S.meta[key], first = S.meta[{ me: "first_me_" + me, us: "first_us" }[kind]];
  if (ai && !aiState){
    const redo = all("asks").find(a => a.by === me && !a.done && a.aiq && S.aiq[a.aiq]?.ans && S.aiq[a.aiq].ats <= aiCut() && (a.ats || 0) < aiCut());
    if (redo) setTimeout(() => answerAsk(redo.id), 0);
  }
  const d = rp && new Date(rp.ts);
  const asks = all("asks").filter(a => a.by === me).sort((x, y) => y.ts - x.ts);
  return `<section style="margin-top:8px">
      ${first ? `<details${rp ? "" : " open"}><summary class="small muted" style="cursor:pointer">첫 리포트</summary><div class="voice report">${esc(first.text)}</div></details>` : ""}
      ${rp ? `<div class="voice report">${esc(rp.text)}</div><span class="small muted">${d.getMonth() + 1}.${d.getDate()} ${hm(rp.ts)}</span>` : ""}
      ${ai ? `<button class="btn primary" id="rp-go" style="align-self:flex-start" ${aiState ? "disabled" : ""}>${aiState || (rp ? "다시 쓰기" : "리포트 쓰기")}</button>` : ""}
    </section>
    <section>
      <label class="inline"><input type="text" id="ask-in" placeholder="궁금한 것" aria-label="궁금한 것 물어보기"><button class="send" id="ask-send" aria-label="보내기">${svg("send")}</button></label>
      ${asks.map(a => `<div class="ask"><b>${esc(a.q)}</b>${a.a ? `<div class="voice" style="font-size:15.5px">${esc(a.a)}</div>` : `<span class="small muted">…</span>`}</div>`).join("")}
    </section>`;
}
function bindReport(v, kind){
  v.querySelector("#rp-go")?.addEventListener("click", () => writeReport(kind));
  const send = () => { const i = v.querySelector("#ask-in"), q = i.value.trim(); if (!q) return i.focus();
    i.value = ""; i.blur(); const id = uid(); put("asks", id, { by: me, q, ts: Date.now() }); answerAsk(id) };
  v.querySelector("#ask-send")?.addEventListener("click", e => { e.preventDefault(); send() });
  v.querySelector("#ask-in")?.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) send() });
}
// 우리 탭: 나 · 상대 · 우리. 나·상대는 그 사람의 기분·에너지·속마음 비율(+ 나는 내 마음)과 리포트, 우리는 두 사람 기분·에너지를 겹쳐 그리고 리포트
VIEWS.stats = () => {
  const sub = route.sub || "me", o = other(me);
  const body = sub === "me" ? oneTrend(me, "smile", "☺", "기분") + oneTrend(me, "energy", "💊", "에너지") + compareHTML(me) + myLoveTrend()
    : sub === "other" ? oneTrend(o, "smile", "☺", "기분") + oneTrend(o, "energy", "💊", "에너지") + compareHTML(o)
    : bothTrend("smile", "☺", "기분") + bothTrend("energy", "💊", "에너지");
  return { title: "우리", html: `
    <div style="display:flex;justify-content:center"><div class="seg">${[["me", "나"], ["other", esc(nameOf(o))], ["us", "관계"]].map(([k, l]) =>
      `<button data-sub="${k}" aria-pressed="${sub === k}">${l}</button>`).join("")}</div></div>
    ${body}
    ${reportHTML(sub)}`,
  bind: v => { autoAI(); v.querySelectorAll("[data-sub]").forEach(b => b.onclick = () => { route.sub = b.dataset.sub; render(true) }); if (reportOpen(sub)) bindReport(v, sub) } };
};
// 속마음 비교 = 밖으로 말한 글자 수 대비 속마음 글자 수 (공백 제외)
//   밖으로 말한 것: 상황의 한마디
//   속마음: 상황의 속마음 글
const chars = s => [...String(s || "").replace(/\s/g, "")].length;
function speechCounts(w){
  let said = 0, inner = 0;
  all("posts").forEach(p => { if (p.who === w){ said += chars(p.text); inner += chars(p.secret) } });
  return { said, inner, ratio: said ? inner / said : null };
}
function compareHTML(only){
  const c = { a: speechCounts("a"), b: speechCounts("b") };
  const max = Math.max(1, c.a.said, c.a.inner, c.b.said, c.b.inner);
  const pct = n => (n / max * 72).toFixed(1); // 오른쪽에 글자 수 들어갈 자리를 남긴다
  const card = w => `<div class="card ratio" style="display:flex;flex-direction:column;gap:12px">
      <div class="post"><div class="head"><b class="who-${w}">${esc(nameOf(w))}</b></div></div>
      <div class="big"><b class="who-${w}">${c[w].ratio == null ? "–" : c[w].ratio.toFixed(2)}</b><span>배</span></div>
      <div class="bars">
        <div class="bar"><span>한마디</span><div class="track"><div class="fill said" style="width:${pct(c[w].said)}%"></div><span class="num">${c[w].said.toLocaleString()}자</span></div></div>
        <div class="bar"><span>속마음</span><div class="track"><div class="fill ${w}" style="width:${pct(c[w].inner)}%"></div><span class="num">${c[w].inner.toLocaleString()}자</span></div></div>
      </div></div>`;
  return only ? card(only) : card(me) + card(other(me));
}
const KINDS = [["couple", "연인"], ["friend", "친구"]];
VIEWS.settings = () => {
  const c = couple();
  draft.kind ??= c.kind;
  const ids = joinedList().sort((x, y) => (SP[x]?.ts || 0) - (SP[y]?.ts || 0));
  const spaceRow = id => {
    const sc = id === space ? c : { names: { a: "", b: "" }, kind: "couple", ...(SP[id] || {}) };
    return `<li><button data-space="${id}" aria-pressed="${id === space}" class="space-row">
      <span class="pair"><span class="who-a">${esc(sc.names.a)}</span> <span class="muted">&amp;</span> <span class="who-b">${esc(sc.names.b)}</span></span>
      <span class="tag ${sc.kind === "friend" ? "b" : "a"}">${sc.kind === "friend" ? "친구" : "연인"}</span>
      </button></li>`;
  };
  const seg = (key, val) => `<div class="seg">${KINDS.map(([k, l]) => `<button data-${key}="${k}" aria-pressed="${val === k}">${l}</button>`).join("")}</div>`;
  return { title: "설정", html: `
    <section><h3>지금 함께하는 사람</h3>
    <div class="card" style="display:flex;flex-direction:column;gap:14px">
      <div class="field"><span class="lab">관계</span>${seg("kind", draft.kind)}</div>
      <div class="field"><label class="lab" for="s-a">첫 번째 사람</label><input type="text" id="s-a" value="${esc(draft.na ?? c.names.a)}" style="color:var(--a)"></div>
      <div class="field"><label class="lab" for="s-b">두 번째 사람</label><input type="text" id="s-b" value="${esc(draft.nb ?? c.names.b)}" style="color:var(--b)"></div>
      <div class="field"><label class="lab" for="s-start">${draft.kind === "friend" ? "친구 된 날" : "사귄 날"} </label><input type="date" id="s-start" value="${esc(draft.start ?? c.start)}"></div>
      <button class="btn primary" id="s-save">저장</button>
    </div>
    <div class="field"><span class="lab">내 색</span>${swatches(c.colors?.[me], c.colors?.[other(me)])}</div>
    <div class="field"><span class="lab">코드</span><span style="font-variant-numeric:tabular-nums;letter-spacing:.15em">${space}</span></div>
    </section>
    <section><h3>사람 바꾸기</h3>
      <ul class="qlist card">${ids.map(spaceRow).join("")}</ul>
      <button class="btn" id="n-add">${svg("plus")} 새 연결</button>
      ${pushHTML()}
      <button class="textbtn" id="leave" style="align-self:flex-start">이 기기에서 나가기</button>
      ${logoutHTML()}
    </section>`,
  bind: v => {
    const keep = () => { draft.na = v.querySelector("#s-a").value; draft.nb = v.querySelector("#s-b").value; draft.start = v.querySelector("#s-start").value };
    v.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { keep(); draft.kind = b.dataset.kind; render(true) });
    v.querySelector("#s-save").onclick = () => {
      putSpace(space, { ...(SP[space] || {}), names: { a: v.querySelector("#s-a").value.trim() || "A", b: v.querySelector("#s-b").value.trim() || "B" },
        start: v.querySelector("#s-start").value, kind: draft.kind });
      draft = {}; toast("저장");
    };
    v.querySelectorAll("[data-space]").forEach(b => b.onclick = () => { if (b.dataset.space !== space) { switchSpace(b.dataset.space); toast("변경") } });
    v.querySelector("#n-add").onclick = () => go("pair", { backTo: "settings" });
    // 이 기기에서만 연결을 내려놓는다 (기록과 자리는 그대로, 같은 계정으로 다시 들어올 수 있다)
    const lv = v.querySelector("#leave");
    lv.onclick = () => {
      if (!lv.dataset.armed){ lv.dataset.armed = 1; lv.textContent = "한 번 더 누르면 나가요"; lv.classList.add("danger"); return }
      lsSet("hito.joined", JSON.stringify(joinedList().filter(id => id !== space)));
      try { localStorage.removeItem("hito.space") } catch {}
      space = null; me = null; subscribeSpace(); COLS.forEach(c => S[c] = {}); go("home");
    };
    bindPush(v);
    bindLogout(v);
    v.querySelectorAll("[data-color]").forEach(b => b.onclick = () => { keep();
      putSpace(space, { ...SP[space], colors: { ...(SP[space]?.colors || {}), [me]: b.dataset.color } }) });
  }};
};

loadLocal();
render(true);
connect();
myIdReady.then(() => render());
</script>
