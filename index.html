<script>
// ---------- icons ----------
const ICON = {
  menu: '<path d="M4 7h16M4 12h16M4 17h10"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  heart: '<path d="M12 20s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 7.3 4.2 4.2 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/>',
  send: '<path d="M5 12h13M13 6l6 6-6 6"/>',
  lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="m11 12 8-8M16 7l2 2"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  check: '<path d="m5 12 4.5 4.5L19 7"/>',
  left: '<path d="M15 5l-7 7 7 7"/>', right: '<path d="m9 5 7 7-7 7"/>',
  image: '<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m4 18 5-5 4 4 3-3 4 4"/>',
  chart: '<path d="M4 19h16M7 15l4-5 3 3 5-6"/>', scale: '<path d="M12 4v16M5 8h14M7 8l-3 6a3 3 0 0 0 6 0zM17 8l-3 6a3 3 0 0 0 6 0z"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>',
  home: '<path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/>',
  pen: '<path d="M4 20h4L19 9l-4-4L4 16z"/>', sun: '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>',
  cloud: '<path d="M7 18a4 4 0 0 1-.5-8A5.5 5.5 0 0 1 17 8.5a4.5 4.5 0 0 1 0 9.5z"/>',
};
const svg = (n, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
// 로고 (로고 시안 아티팩트 그대로): Caveat 손글씨 검은 글씨 + 색연필 밑칠(#pencil). 색은 두 사람의 색을 따른다
// 아이폰 사파리는 필터를 건 글자를 글자 상자까지만 그려서 "o" 뒤 색연필이 잘린다 — 로고 전체 크기의 투명 사각형을 같은 묶음에 넣어 상자를 넓힌다
const LOGO = `<svg class="logo-mark" width="91" height="47" preserveAspectRatio="xMinYMid meet" viewBox="80 12 220 114" role="img" aria-label="HiTo">
  <g class="under" filter="url(#pencil)"><rect x="80" y="12" width="220" height="114" fill="#000" fill-opacity="0"/><text x="89.4" y="94.4" style="font:700 98px Caveat,cursive"><tspan fill="var(--logo-a)">Hi</tspan><tspan fill="var(--logo-b)">To</tspan></text></g>
  <g filter="url(#pen)"><rect x="80" y="12" width="220" height="114" fill="#000" fill-opacity="0"/><text x="85.5" y="92" fill="var(--ink)" style="font:700 98px Caveat,cursive">HiTo</text></g></svg>`;

// ---------- built-in content ----------
const DAILY_LIMIT = 6; // 하루에 올리는 상황 수. basic: 각자 6개 / pro: 각자 24개
const PLACEHOLDERS = ["cloud", "sun", "heart"];

// ---------- storage: shared db when available, this browser otherwise ----------
// mods = AI가 정리한 모듈러, base = 기본 질문 답 (id = 사람), daily = 오늘 질문 · 기분 (id = 사람_날짜),
// aiq = 상대에게 보낸 질문 (직접 쓴 것 direct / 궁금한 것에서 생긴 것 fromAsk), asks = 내가 Claude에게 물은 것
const COLS = ["meta", "posts", "events", "projects", "mods", "aiq", "asks", "base", "daily"];
const S = Object.fromEntries(COLS.map(c => [c, {}]));
let db = null, mode = "local";
function lsGet(k){ try { return localStorage.getItem(k) } catch { return null } }
function lsSet(k, v){ try { localStorage.setItem(k, v) } catch {} }
// 연결 = 두 사람이 함께 정한 6자리 코드. 한 사람이 코드를 만들고(a), 상대가 그 코드를 넣으면(b) 연결된다.
// 기록은 spaces/<코드>/<컬렉션> 아래에 쌓고, 연결 정보(이름·관계·누가 들어왔는지)는 spaces/<코드>에 둔다.
// 이 기기가 들어간 연결 목록과 각 연결에서 내가 a인지 b인지는 이 기기에만 저장한다.
let space = lsGet("hito.space");
let SP = {};
// 초대 링크(?join=코드)로 열렸으면 코드를 기억해 두고 주소에서는 지운다. 로그인을 거쳐도 남도록 저장한다
{ const q = new URLSearchParams(location.search), c = (q.get("join") || "").replace(/\D/g, "");
  if (c.length === 6) lsSet("hito.invite", c);
  if (q.has("join")) try { q.delete("join"); history.replaceState(null, "", location.pathname + (String(q) ? "?" + q : "") + location.hash) } catch {} }
const colPath = col => `spaces/${space}/${col}`;
const lsData = () => "hito.data." + space;
const lsMe = () => "hito.me." + space;
const joinedList = () => { try { return JSON.parse(lsGet("hito.joined") || "[]") } catch { return [] } };
function loadLocal(){
  try { const d = JSON.parse(lsGet(lsData()) || "{}"); COLS.forEach(c => S[c] = d[c] || {}) } catch {}
  try { SP = JSON.parse(lsGet("hito.spaces") || "{}") } catch {}
}
function saveLocal(){ if (mode === "local") lsSet(lsData(), JSON.stringify(S)) }

const chains = {};
// 저장 권한이 없으면(공개 링크로 들어온 외부 사람 등) 쓰기가 invalid_argument 로 거절된다
const noWrite = e => ["permission_denied", "not_granted", "invalid_argument"].includes(e?.code);
// 저장이 되면 true, 안 되면 false 로 끝나는 약속을 돌려준다
function queue(key, fn){
  const p = (chains[key] || Promise.resolve()).then(fn).then(() => true, e => {
    toast(noWrite(e) ? "저장 권한 없음 · 공유에서 편집자로 초대받아야 해요" : "저장 실패");
    return false;
  });
  chains[key] = p; return p;
}
function put(col, id, obj){
  S[col] = { ...S[col], [id]: obj }; saveLocal(); render();
  const path = colPath(col);
  if (db) queue(path + "/" + id, () => db.collection(path).doc(id).set(obj));
}
function del(col, id){
  const n = { ...S[col] }; delete n[id]; S[col] = n; saveLocal(); render();
  const path = colPath(col);
  if (db) queue(path + "/" + id, () => db.collection(path).doc(id).delete());
}
function putSpace(id, obj){
  const prev = SP[id];
  SP = { ...SP, [id]: obj }; if (mode === "local") lsSet("hito.spaces", JSON.stringify(SP)); render();
  if (!db) return Promise.resolve(true);
  // 저장이 거절되면 화면에 먼저 반영한 것을 되돌린다
  return queue("spaces/" + id, () => db.collection("spaces").doc(id).set(obj))
    .then(ok => { if (!ok){ SP = { ...SP }; if (prev) SP[id] = prev; else delete SP[id]; render(true) } return ok });
}
let unsubs = [];
function subscribeSpace(){
  unsubs.forEach(u => u()); unsubs = [];
  if (!space) return;
  const at = space;
  unsubs = COLS.map(col => db.collection(colPath(col)).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = d.data() }); S[col] = m;
    if (col === "base" && space === at){ baseLoaded = at; syncBase() }
    render();
  }, () => toast("연결 끊김")));
}

// 앱 버전에서만. 연결 안의 base/<나> 와 서로 빠진 답을 채우고, 같은 질문이면 나중에 고친 쪽을 쓴다
let UB = null, ubOff = null, baseLoaded = null;
const ubPath = () => `users/${myId}/base`;
function subscribeMine(){
  ubOff?.(); ubOff = null;
  if (!db || !myId || !window.hitoApp) return;
  ubOff = db.collection(ubPath()).onSnapshot(snap => { UB = snap.docs.find(d => d.id === "me")?.data() || {}; syncBase() }, () => {});
}
function syncBase(){
  if (!UB || !me || !space || baseLoaded !== space) return;
  // 이 연결에 들어온 때(got)를 찍어 둔다 — 정리는 ts 가 아니라 got 으로 새 답을 고른다 (옛날에 쓴 답도 이 연결에선 새것)
  const d = baseDoc(me), mine = UB.ans || {}, here = d.ans || {}, now = Date.now();
  const newer = (x, y) => !y || (x.ts || 0) > (y.ts || 0);
  const ans = { ...here }, acct = { ...mine }; let toHere = false, toMine = false;
  // 관계 · 연인 답은 그 상대에 대한 답이라 연결마다 따로 — 계정으로 오가지 않는다
  const isAcct = k => !!qByName(k)?.acct;
  Object.entries(mine).forEach(([k, a]) => { if (isAcct(k) && newer(a, here[k])){ ans[k] = { ...a, got: now }; toHere = true } });
  Object.entries(here).forEach(([k, a]) => { if (isAcct(k) && newer(a, mine[k])){ const { got, ...rest } = a; acct[k] = rest; toMine = true } });
  if (toHere){
    const full = baseList().every(q => isAnswered(ans[q.name], q));
    put("base", me, { ...d, who: me, ans, ...(full && !d.done ? { done: now } : {}) });
    syncPickMods();
  }
  if (toMine){
    UB = { ...UB, ans: acct };
    queue(ubPath() + "/me", () => db.collection(ubPath()).doc("me").set(UB));
  }
}

// 폰 원본(수십 MB)을 data URL로 통째 읽으면 안드로이드에서 메모리가 터진다 → 비트맵으로 바로 줄인다
async function decode(file){
  if (window.createImageBitmap) try { return await createImageBitmap(file, { imageOrientation: "from-image" }) } catch {}
  const url = URL.createObjectURL(file);
  try { return await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = url }) }
  finally { setTimeout(() => URL.revokeObjectURL(url), 0) }
}
async function shrink(file, max = 640){
  const img = await decode(file), w = img.width, h = img.height;
  const k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); img.close?.();
  return c.toDataURL("image/jpeg", .72);
}

  const latest = all("posts").filter(p => p.who === o).sort((x, y) => y.ts - x.ts)[0];
  const html = latest ? postHTML(latest)
    : empty("image", "아직 없음", "");
  return { html, bind: v => {
    v.querySelector("[data-go-compose]")?.addEventListener("click", () => go("compose"));
    bindPosts(v);
  }};
};

// 속마음은 쓴 사람만 보고, 상대는 기록 화면에서 ♥를 써서 열람한 뒤에만 본다
// (홈에서는 속마음이 있는지조차 드러내지 않는다)
function postHTML(p){
  const replies = (p.replies || []).map(r => `<div class="reply ${r.who}">${esc(r.text)}</div>`).join("");
  const liked = p.likes?.[me];
  const theirs = p.who !== me;
  // 하트는 사진 바로 밑. 상대 글이면 누를 수 있고, 내 글이면 상대가 눌렀는지만 보인다
  const like = theirs
    ? `<button class="like ${liked ? "on" : ""}" data-like="${p.id}" aria-pressed="${!!liked}" aria-label="하트">${svg("heart")}</button>`
    : Object.values(p.likes || {}).some(Boolean) ? `<span class="like on" aria-label="하트 받음">${svg("heart")}</span>` : "";
  return `<article class="post card" id="p-${p.id}">
    <div class="head"><b class="who-${p.who}">${esc(nameOf(p.who))}</b><time>${hm(p.ts)}</time></div>
    <div class="media">${media(p)}</div>
    ${like ? `<div class="actions">${like}</div>` : ""}
    <div class="voice">${esc(p.text)}</div>
    ${replies}
    <div class="actions">
      ${theirs ? `<label class="inline"><input type="text" id="r-${p.id}" placeholder="" aria-label="한마디 남기기"><button class="send" data-reply="${p.id}" aria-label="남기기">${svg("send")}</button></label>`
      : `<span style="flex:1"></span><button class="textbtn" data-delpost="${p.id}">지우기</button>`}
    </div></article>`;
}
function bindPosts(v){
  v.querySelectorAll("[data-like]").forEach(b => b.onclick = () => {
    const p = S.posts[b.dataset.like]; put("posts", b.dataset.like, { ...p, likes: { ...(p.likes || {}), [me]: !p.likes?.[me] } });
  });
  const send = id => {
    const inp = v.querySelector("#r-" + id), t = inp.value.trim(); if (!t) return inp.focus();
    inp.value = ""; inp.blur();
    const p = S.posts[id]; put("posts", id, { ...p, replies: [...(p.replies || []), { who: me, text: t, ts: Date.now() }] });
  };
  v.querySelectorAll("[data-reply]").forEach(b => b.onclick = e => { e.preventDefault(); send(b.dataset.reply) });
  v.querySelectorAll("input[id^='r-']").forEach(i => i.onkeydown = e => { if (e.key === "Enter" && !e.isComposing) send(i.id.slice(2)) });
  v.querySelectorAll("[data-delpost]").forEach(b => b.onclick = () => armDelete(b, () => del("posts", b.dataset.delpost)));
}

    <div class="line"><svg viewBox="0 0 24 24" style="color:var(--ink-2)">${ICON.heart}</svg><textarea id="c-secret" rows="1" aria-label="속마음">${esc(draft.secret || "")}</textarea></div>
    <button class="btn primary" id="c-post" style="align-self:flex-end">${esc(nameOf(other(me)))}에게 보여 주기</button>`,

      catch { toast(/hei[cf]/i.test(f.type + f.name) ? "HEIC 사진은 못 열어요 · 카메라 설정에서 '고효율 사진'을 꺼 주세요" : "열 수 없는 사진") }
      e.target.value = "" };
    // 줄이 늘어나면 칸도 같이 늘어난다
    const grow = t => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px" };
    v.querySelectorAll(".line textarea").forEach(grow);
    v.querySelector("#c-text").oninput = e => { draft.text = e.target.value; grow(e.target) };
    v.querySelector("#c-secret").oninput = e => { draft.secret = e.target.value; grow(e.target) };
    v.querySelector("#c-post").onclick = () => {
      const text = (draft.text || "").trim(); if (!text) { toast("한마디 없음"); return v.querySelector("#c-text").focus() }

      put("posts", uid(), { who: me, ts: Date.now(), text, secret: (draft.secret || "").trim(), photo: draft.photo || null,
        likes: {}, replies: [] });
      toast("올림"); go("home");
    };
  }};
};

// ♥ 하트 = 점수. 오늘 질문에 답하거나 상대가 내 상황에 하트를 누르면 +1,
// 상대의 속마음(상황 속마음 · 받은 질문의 속마음 답)을 하나 열 때마다 −1
const HEART_COST = 1;
function heartBalance(){
  const answered = all("daily").filter(d => d.who === me).reduce((n, d) => n + (d.qs || []).filter(q => (q.a || "").trim()).length, 0);
  const liked = Object.values(S.posts).filter(p => p.who === me && p.likes?.[other(me)]).length;
  const spent = Object.values(S.posts).filter(d => d.unlockedBy === me).length + all("aiq").filter(q => q.unlockedBy === me).length
    + all("daily").filter(d => d.sayOpenedBy === me).length;
  return answered + liked - spent * HEART_COST;
}
const canSpend = () => heartBalance() >= HEART_COST;

const filled = v => Array.isArray(v) ? v.length > 0 : !!String(v ?? "").trim();
const baseDoc = w => S.base[w] || { who: w, ans: {} };
// 선지: 「앞 질문에서 고른 것」이면 그 질문에서 고른 선지들
const optsOf = (q, w = me) => q.from ? (baseDoc(w).ans?.[q.from]?.pick || []).map(i => qByName(q.from).o[i]) : q.o;
const isAnswered = (a, q) => !!a && (!!a.no || (a.pick || []).length > 0 || filled(a.etc));
// 패스한 문제는 맨 뒤로 가고, 다시 답할 때까지 진행 수에 들어가지 않는다 (base/<사람>.pass = 패스한 순서)
const passed = w => baseDoc(w).pass || [];
const baseOrder = w => { const p = passed(w), list = baseList(); return [...list.filter(q => !p.includes(q.name)), ...p.map(k => list.find(q => q.name === k)).filter(Boolean)] };
// 다른 연결에서 답해 계정으로 들어온 답(got)은 이미 답한 것으로 본다
const doneQ = (w, q) => { const a = baseDoc(w).ans?.[q.name]; return isAnswered(a, q) && !!(a.at || a.got) && !passed(w).includes(q.name) };
const baseCount = w => baseList().filter(q => doneQ(w, q)).length;
// 끝남 = 끝 표시가 있고 지금 목록을 다 답했을 때 (질문이 바뀌면 다시 열린다)
const baseDone = w => !!S.base[w]?.done && baseList().every(q => isAnswered(baseDoc(w).ans?.[q.name], q));
const opened = () => baseDone("a") && baseDone("b");
// 오늘 답한 수 (처음 답한 때 at 기준)와 오늘 열린 수 (5 + 5 × 더 하기)
const isToday = ts => !!ts && ymd(new Date(ts)) === ymd(new Date());
const answeredToday = () => baseList().filter(q => doneQ(me, q) && isToday(baseDoc(me).ans?.[q.name]?.at)).length;
const baseLimit = () => BASE_DAY * (1 + (baseDoc(me).more?.[ymd(new Date())] || 0));
// 리포트 · 정리에 넘기는 한 줄: 고른 선지와 기타
const baseText = (a, q, w = me) => [((a.pick || []).map(i => optsOf(q, w)[i]?.[0]).filter(Boolean).join(" / ")), a.etc ? `기타: ${a.etc}` : ""].filter(Boolean).join(" · ");
// 고른 선지 → 명제가 바로 닻이 된다(AI 없음). id 를 정해 두어 고치면 덮어쓰고, 안 고른 것은 지운다
const SORE = name => /아픔|아픈/.test(name); // 아픔: 상대 쪽엔 아무것도 안 간다
function pickMods(w, q){
  const a = baseDoc(w).ans?.[q.name] || {}, pick = new Set(a.no ? [] : a.pick || []), opts = optsOf(q, w);
  (q.from ? qByName(q.from).o : q.o).forEach((_, i) => {
    const id = `pk_${w}_${q.n}_${i}`, o = opts[i], has = S.mods[id];
    if (!pick.has(i) || !o){ if (has) del("mods", id); return }
    const text = q.from ? `여러 바람 중 「${o[0]}」가 가장 위에 있다` : o[1] || `${q.name}: ${o[0]}`;
    const wish = SORE(q.name) ? "" : (o[2] || text);
    if (has?.text === text && has?.wish === wish) return;
    put("mods", id, { who: w, about: w, text, wish, secret: true, anchor: true, kind: "선지", area: q.br, from: q.name,
      ...(q.how === "one" ? { mark: "꼭대기" } : q.how === "min" ? { mark: "바닥" } : {}), ts: has?.ts || Date.now() });
  });
}
const syncPickMods = (w = me) => baseList().forEach(q => { if (doneQ(w, q) || S.mods[`pk_${w}_${q.n}_0`]) pickMods(w, q) });
function saveBaseAns(key, a){
  const d = baseDoc(me), q = qByName(key), prev = d.ans?.[key];
  // 고를 때마다 바로 저장한다. 오늘 몇 개 했는지(at)는 「답하기」를 누를 때 센다 — 고르는 순간 하루가 끝나지 않게
  put("base", me, { ...d, who: me, ans: { ...(d.ans || {}), [key]: { ...a, ts: Date.now(), ...(prev?.at ? { at: prev.at } : {}) } } });
  if (q) pickMods(me, q);
  syncBase();
}
// 쓰는 중인 기타 글은 draft.be[질문] 에 두었다가 넘기거나 칸을 벗어날 때 저장한다
function flushBase(){
  const be = draft.be || {}; draft.be = {};
  Object.entries(be).forEach(([key, t]) => { const a = baseDoc(me).ans?.[key] || {};
    if ((a.etc || "") !== t) saveBaseAns(key, { ...a, no: false, etc: t }) });
}
const baseAt = () => { const list = baseOrder(me); return Math.max(0, Math.min(draft.bi ?? 0, list.length - 1)) };
const firstOpen = () => baseOrder(me).findIndex(q => !doneQ(me, q));
const HOW = { many: "여러 개 골라도 돼요", one: "하나만 골라 주세요", min: "없으면 안 되는 것만 골라 주세요" };
function baseHTML(){
  const list = baseOrder(me), d = baseDoc(me);
  draft.bi ??= Math.max(0, firstOpen());
  const q = list[baseAt()], a = d.ans?.[q.name] || {}, pick = a.pick || [], opts = optsOf(q);
  return `<div class="welcome" style="padding-top:8px">
    <span class="small muted">오늘 ${answeredToday()}/${baseLimit()}</span>
    <h2 class="bask">${esc(q.ask)}</h2>
    ${q.desc ? `<p class="bdesc">${esc(q.desc)}</p>` : ""}
    <span class="small muted">${HOW[q.how]}</span>
    <div class="opts">${opts.map((o, i) => `<button class="opt" data-o="${i}" aria-pressed="${pick.includes(i)}">${esc(o[0])}</button>`).join("")}</div>
    <label class="bf"><span class="small muted">기타</span>
      <textarea class="short" rows="1" data-etc aria-label="기타">${esc(draft.be?.[q.name] ?? a.etc ?? "")}</textarea></label>
    ${q.sens ? `<div class="bq-row"><button class="textbtn" data-no aria-pressed="${!!a.no}">${a.no ? "✓ " : ""}말하고 싶지 않음</button><span></span></div>` : ""}
    <div class="bq-row"><button class="btn" id="bp-prev" ${baseAt() ? "" : "disabled"}>이전</button>
      <button class="textbtn" id="bp-pass">패스</button>
      <button class="btn primary" id="bp-next">답하기</button></div>
  </div>`;
}
function bindBase(v){
  const list = baseOrder(me), i = baseAt(), q = list[i], key = q.name;
  const cur = () => baseDoc(me).ans?.[key] || {};
  v.querySelectorAll("[data-o]").forEach(b => b.onclick = () => { flushBase();
    const k = +b.dataset.o, a = cur(), p = a.pick || [];
    const pick = q.how === "one" ? (p.includes(k) ? [] : [k]) : p.includes(k) ? p.filter(x => x !== k) : [...p, k].sort((x, y) => x - y);
    saveBaseAns(key, { ...a, no: false, pick }) });
  const t = v.querySelector("[data-etc]");
  const grow = () => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px" }; grow();
  t.oninput = () => { (draft.be ||= {})[key] = t.value; grow() };
  t.onblur = () => setTimeout(flushBase, 250);
  v.querySelector("[data-no]")?.addEventListener("click", () => { flushBase(); const a = cur(); saveBaseAns(key, { ...a, no: !a.no }) });
  const top = () => { render(true); document.getElementById("view").scrollTop = 0 };
  v.querySelector("#bp-prev")?.addEventListener("click", () => { flushBase(); draft.bi = i - 1; top() });
  // 패스: 이 문제를 맨 뒤로 보낸다. 같은 자리(i)에 다음 문제가 온다
  v.querySelector("#bp-pass").onclick = () => { flushBase(); const d = baseDoc(me);
    put("base", me, { ...d, who: me, pass: [...(d.pass || []).filter(k => k !== key), key] }); top() };
  // 답하기: 아무것도 안 골랐으면 넘어가지 않는다. 다 답하면 끝, 아니면 다음 안 푼 문제로
  v.querySelector("#bp-next").onclick = () => {
    flushBase();
    if (!isAnswered(cur(), q)) { toast("골라 주세요 · 패스할 수도 있어요"); return }
    // 답하기를 누른 때(at)로 오늘 몇 개 했는지 센다. 패스했던 문제면 패스에서 뺀다
    { const d = baseDoc(me), a = cur();
      put("base", me, { ...d, who: me, ans: { ...d.ans, [key]: { ...a, at: a.at || Date.now(), ts: Date.now() } }, pass: (d.pass || []).filter(k => k !== key) }); syncBase(); }
    if (!baseList().some(x => !doneQ(me, x))) { put("base", me, { ...baseDoc(me), who: me, done: Date.now() }); toast("다 답했어요"); draft = {}; top(); return }
    const next = baseOrder(me).findIndex((x, j) => j > i && !doneQ(me, x));
    draft.bi = next >= 0 ? next : Math.max(0, firstOpen()); top();
  };
}

// ---------- 하루 마무리: 기분 · 에너지 · 사랑, 상대에게 하고 싶은 말(속마음), 상대에게 질문하기 ----------
const todayKey = (w = me) => `${w}_${ymd(new Date())}`;
const todayDoc = () => S.daily[todayKey()];
const relOf = date => S.meta["rel_" + date];
// 받을 질문: 상대가 직접 물었거나(direct) 궁금한 것 리포트가 보낸 것(fromAsk). 줄을 선 순서대로
const queuedFor = w => all("aiq").filter(q => q.for === w && !q.used && !q.ans && (q.direct || q.fromAsk)).sort((x, y) => x.ts - y.ts)[0];
function moodSliders(){
  draft.mood ??= { smile: 50, energy: 50, love: 50 };
  const sl = (k, ic, label, color) => `<div class="slider"><label for="m-${k}" aria-label="${label}">${ic}</label>
    <input type="range" id="m-${k}" min="0" max="100" value="${draft.mood[k]}" style="--v:${draft.mood[k]}%;--tc:var(${color})"><output id="o-${k}">${draft.mood[k]}</output></div>`;
  return `<div class="field">${sl("smile", "☺", "기분", "--b")}${sl("energy", "💊", "에너지", "--accent")}${sl("love", "♡", loveWord() + " · 나만 보여요", "--a")}</div>`;
}
// 하고 싶은 말 + 질문하기 (옆 버튼을 누르면 질문 칸이 열린다. 그 질문은 상대의 질문들 뒤에 나온다)
function sayAskHTML(){
  const O = esc(nameOf(other(me)));
  return `<div class="bq"><div class="bq-row"><span class="small muted">${O}님에게 하고 싶은 말 · 속마음</span>
      <button class="textbtn" id="t-ask-open" aria-pressed="${!!draft.asking}">${O}님에게 질문하기</button></div>
    <textarea class="short" rows="2" id="t-say" aria-label="${O}님에게 하고 싶은 말">${esc(draft.say || "")}</textarea>
    ${draft.asking ? `<span class="small muted">${O}님에게 할 질문 · ${O}님의 질문들 뒤에 나와요</span>
      <textarea class="short" rows="1" id="t-ask" aria-label="${O}님에게 할 질문">${esc(draft.ask || "")}</textarea>` : ""}</div>`;
}
function bindMoodSayAsk(v){
  ["love", "smile", "energy"].forEach(k => v.querySelector("#m-" + k)?.addEventListener("input", e => {
    draft.mood[k] = +e.target.value; e.target.style.setProperty("--v", e.target.value + "%"); v.querySelector("#o-" + k).textContent = e.target.value }));
  const say = v.querySelector("#t-say"); if (say) say.oninput = () => { draft.say = say.value };
  const ask = v.querySelector("#t-ask"); if (ask) ask.oninput = () => { draft.ask = ask.value };
  v.querySelector("#t-ask-open")?.addEventListener("click", () => { draft.asking = !draft.asking; render(true) });
}
// 마무리 저장: 내 하루 문서(daily/<나>_<날짜>)에 기분 · 하고 싶은 말, 질문은 상대의 줄(aiq)에
function finishDay(extra = {}){
  const d = todayDoc() || { who: me, date: ymd(new Date()), ts: Date.now(), qs: [] }, now = Date.now();
  const say = (draft.say || "").trim(), ask = (draft.ask || "").trim();
  put("daily", todayKey(), { ...d, ...extra, mood: { ...draft.mood }, ...(say ? { say } : {}), done: now });
  if (ask) put("aiq", uid(), { for: other(me), q: ask, ts: now, by: me, direct: true });
}
// 받은 질문 하나 (처음 질문들 5개 뒤에): 답은 물은 사람에게도 간다 — 공개 답 / 속마음 답(가려지고 ♥로 열람)
function receivedHTML(q){
  draft.share ??= "open";
  return `<div class="welcome" style="padding-top:8px">
    <span class="small muted">${q.direct ? `${esc(nameOf(q.by))}님이 물었어요` : "질문"}</span>
    <h2 class="bask">${esc(q.q)}</h2>
    <textarea data-rq aria-label="${esc(q.q)}">${esc(draft.rq || "")}</textarea>
    ${q.direct ? `<div class="seg">${[["open", "공개 답"], ["secret", "속마음 답"]].map(([k, l]) => `<button data-share="${k}" aria-pressed="${draft.share === k}">${l}</button>`).join("")}</div>` : ""}
    <div class="bq-row"><span></span><button class="btn primary" id="rq-go">답하기</button></div></div>`;
}
function bindReceived(v, q){
  const t = v.querySelector("[data-rq]"); t.oninput = () => { draft.rq = t.value };
  v.querySelectorAll("[data-share]").forEach(b => b.onclick = () => { draft.share = b.dataset.share; render(true) });
  v.querySelector("#rq-go").onclick = () => {
    const a = (draft.rq || "").trim(); if (!a) { toast("비어 있어요"); return }
    const now = Date.now(), date = ymd(new Date()), d = todayDoc() || { who: me, date, ts: now, qs: [] }, secret = q.direct && draft.share === "secret";
    const { id, ...rest } = q;
    put("aiq", id, { ...rest, ans: a, ats: now, secret, used: date });
    put("daily", todayKey(), { ...d, qs: [...(d.qs || []), { k: "me", q: q.q, aiqId: id, ...(q.direct ? { from: q.by, share: secret ? "secret" : "open" } : {}), a, ats: now }] });
    draft.rq = ""; draft.share = "open"; toast("♥+1");
  };
}
function dayEndHTML(){
  return `<div class="welcome" style="padding-top:8px"><span class="daytitle">오늘은 여기까지</span>${moodSliders()}${sayAskHTML()}
    <button class="btn primary" id="t-end" style="align-self:flex-end">오늘 끝</button></div>`;
}
// 끝난 뒤: 상대가 나에게 남긴 말(속마음, ♥로 열람), 관계 질문 두 사람 답, 내가 물은 것, 5개 더 하기
function doneHTML(d){
  const o = other(me), theirs = S.daily[`${o}_${d.date}`], rq = relOf(d.date)?.q;
  const relA = w => (w === me ? d : theirs)?.qs?.find(q => q.k === "rel")?.a;
  const asked = all("aiq").filter(q => q.by === me && q.direct).sort((x, y) => y.ts - x.ts).slice(0, 5);
  const locked = (text, attr) => `${maskHTML(text.length)}${canSpend() ? `<button class="btn accent sm" ${attr}>♥${HEART_COST}로 열람</button>` : ""}`;
  const ansHTML = q => !q.ans ? `<span class="small muted">아직</span>`
    : q.secret && q.unlockedBy !== me ? locked(q.ans, `data-unlockq="${q.id}"`) : `<div class="voice who-${o}">${esc(q.ans)}</div>`;
  const more = !baseDone(me);
  return `<div class="welcome" style="padding-top:8px">
    <span class="daytitle">오늘은 끝</span>
    ${more ? `<button class="btn" id="t-more" style="align-self:flex-start">5개 더 하기</button>`
      : !opened() ? `<span class="small muted">${esc(nameOf(o))}님이 아직 답하는 중이에요 · 다 답하면 오늘 질문과 관계 리포트가 열려요</span>` : ""}
    ${theirs?.say ? `<div class="bq"><span class="small muted">${esc(nameOf(o))}님이 하고 싶은 말</span>${theirs.sayOpenedBy === me ? `<div class="voice who-${o}">${esc(theirs.say)}</div>` : locked(theirs.say, "data-unlocksay")}</div>` : ""}
    ${rq ? `<div class="bq"><span class="small muted">우리 질문</span><b>${esc(rq)}</b>
      ${["a", "b"].map(w => { const a = relA(w); return a ? `<div class="voice who-${w}">${esc(a)}</div>` : `<span class="small muted">${esc(nameOf(w))} 아직</span>` }).join("")}</div>` : ""}
    ${asked.length ? `<div class="bq"><span class="small muted">내가 물은 것</span>${asked.map(q => `<b>${esc(q.q)}</b>${ansHTML(q)}`).join("")}</div>` : ""}
  </div>`;
}
function bindDone(v){
  const o = other(me), date = ymd(new Date());
  v.querySelector("#t-more")?.addEventListener("click", () => { const d = baseDoc(me);
    put("base", me, { ...d, who: me, more: { ...(d.more || {}), [date]: (d.more?.[date] || 0) + 1 } }); draft = {} });
  v.querySelectorAll("[data-unlockq]").forEach(b => b.onclick = () => { const id = b.dataset.unlockq; put("aiq", id, { ...S.aiq[id], unlockedBy: me }); toast(`♥−${HEART_COST}`) });
  v.querySelector("[data-unlocksay]")?.addEventListener("click", () => { const k = `${o}_${date}`; put("daily", k, { ...S.daily[k], sayOpenedBy: me }); toast(`♥−${HEART_COST}`) });
}

// ---------- 오늘 질문: 하루 세 개 — 나 · 상대 · 관계. 답은 모두 줄글, 정리가 모듈러를 뽑는다 (3장) ----------
function todayHTML(){
  const d = todayDoc();
  if (!d) return `<div class="welcome" style="align-items:center;text-align:center"><span class="muted">${aiState || (ai ? "오늘 질문을 준비해요" : "Claude를 쓸 수 없어요")}</span></div>`;
  if (d.done) return doneHTML(d);
  draft.ta ??= d.qs.map(q => q.a || "");
  draft.shares ??= d.qs.map(q => q.share || "open");
  const label = q => q.from ? `${esc(nameOf(q.from))}님이 물었어요` : q.k === "me" ? "내 질문" : q.k === "other" ? `${esc(nameOf(other(me)))}님에 대한 질문 · 상대는 못 봐요` : "우리 질문 · 상대도 봐요";
  return `<div class="welcome" style="padding-top:8px">
    <span class="daytitle">오늘</span>
    ${moodSliders()}
    ${d.qs.map((q, i) => `<div class="bq"><span class="small muted">${label(q)}</span><b>${esc(q.q)}</b>
      <textarea data-ta="${i}" aria-label="${esc(q.q)}">${esc(draft.ta[i])}</textarea>
      ${q.from ? `<div class="seg">${[["open", "공개 답"], ["secret", "속마음 답"]].map(([k, l]) => `<button data-shares="${i}:${k}" aria-pressed="${draft.shares[i] === k}">${l}</button>`).join("")}</div>` : ""}</div>`).join("")}
    ${sayAskHTML()}
    <button class="btn primary" id="t-done" style="align-self:flex-end">오늘 끝</button></div>`;
}
function bindToday(v){
  v.querySelectorAll("[data-ta]").forEach(t => t.oninput = () => { draft.ta[+t.dataset.ta] = t.value });
  v.querySelectorAll("[data-shares]").forEach(b => b.onclick = () => { const [i, k] = b.dataset.shares.split(":"); draft.shares[+i] = k; render(true) });
  bindMoodSayAsk(v);
  v.querySelector("#t-done")?.addEventListener("click", () => {
    const d = todayDoc(), now = Date.now();
    const qs = d.qs.map((q, i) => ({ ...q, a: (draft.ta[i] || "").trim(), ats: now, ...(q.from ? { share: draft.shares[i] } : {}) }));
    qs.forEach(q => { if (q.aiqId && q.a && S.aiq[q.aiqId]) put("aiq", q.aiqId, { ...S.aiq[q.aiqId], ans: q.a, ats: now, secret: q.share === "secret" }) });
    finishDay({ qs });
    const n = qs.filter(q => q.a).length; draft = {}; toast(n ? `♥+${n}` : "오늘 끝");
  });
  bindDone(v);
}

// ? 탭: 처음 질문들(하루 5개) → 받은 질문 → 하루 마무리 → (두 사람이 다 답하면) 오늘 질문
function dayStep(){
  if (opened()) return "today";
  const d = todayDoc();
  if (!baseDone(me) && answeredToday() < baseLimit()) return "base";
  if (!d?.done && queuedFor(me)) return "received";
  if (!d?.done) return "end";
  return "done";
}
VIEWS.questions = () => {
  const step = dayStep(), q = step === "received" ? queuedFor(me) : null;
  const html = step === "base" ? baseHTML() : step === "received" ? receivedHTML(q) : step === "end" ? dayEndHTML()
    : step === "done" ? doneHTML(todayDoc()) : todayHTML();

// 우리 탭: 통계(기분 · 에너지) · 속마음 · 관계
const W = 340, H = 190, L = 30, R = 12, T = 12, B = 26;
function trendChart(series, label){ // series: [{arr, color, key}]
  const pts = series.flatMap(s => s.arr);
  const t0 = Math.min(...pts.map(p => p.ts)), t1 = Math.max(...pts.map(p => p.ts)), span = Math.max(1, t1 - t0);
  const x = ts => L + (W - L - R) * (ts - t0) / span, y = v => T + (H - T - B) * (1 - v / 100);
  const line = ({ arr, color: c, key: k }) => { if (!arr.length) return ""; const pt = p => `${x(p.ts).toFixed(1)},${y(p.mood[k]).toFixed(1)}`;
    return `<path d="${arr.map((p, i) => (i ? "L" : "M") + pt(p)).join("")}${arr.length > 1 ? `L${x(arr.at(-1).ts).toFixed(1)},${y(0)}L${x(arr[0].ts).toFixed(1)},${y(0)}Z` : ""}" fill="var(--${c})" fill-opacity=".08" stroke="none"/>
    <polyline points="${arr.map(pt).join(" ")}" fill="none" stroke="var(--${c})" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${arr.map((p, i) => `<circle cx="${x(p.ts).toFixed(1)}" cy="${y(p.mood[k]).toFixed(1)}" r="${i === arr.length - 1 ? 4.5 : 2.4}" fill="${i === arr.length - 1 ? "var(--surface)" : `var(--${c})`}" stroke="var(--${c})" stroke-width="2"/>`).join("")}` };
  const grid = [0, 50, 100].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--hair)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="10.5" fill="var(--ink-2)">${v}</text>`).join("");
  const md = ts => { const d = new Date(ts); return `${d.getMonth() + 1}.${d.getDate()}` };
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">${grid}
    <text x="${L}" y="${H - 6}" font-size="10.5" fill="var(--ink-2)">${md(t0)}</text><text x="${W - R}" y="${H - 6}" font-size="10.5" text-anchor="end" fill="var(--ink-2)">${md(t1)}</text>
    ${series.map(line).join("")}</svg>`;
}
// 기분 · 에너지 · 사랑 = 오늘 질문 끝에서 하루 한 번 (예전 상황에 붙은 것도 함께 그린다)

  ...all("posts").filter(p => p.who === w && p.mood?.[k] != null)].sort((x, y) => x.ts - y.ts).slice(-n);
const avgOf = (arr, k) => arr.length ? Math.round(arr.reduce((n, p) => n + p.mood[k], 0) / arr.length) : "–";
function bothTrend(k, ic, label){

      ${trendChart([{ arr: pa, color: "a", key: k }, { arr: pb, color: "b", key: k }], `${label} 변화 그래프`)}
      <div class="legend"><span><i style="background:var(--a)"></i>${esc(nameOf("a"))} 평균 ${avgOf(pa, k)}</span><span><i style="background:var(--b)"></i>${esc(nameOf("b"))} 평균 ${avgOf(pb, k)}</span></div>

}

// 리포트 글 → 카드: 첫 문단이 한 줄뿐이면 제목, 여러 줄 문단은 첫 줄이 소제목이고 소제목마다 새 카드
const reportBody = t => { const cards = [[]];
  String(t || "").trim().split(/\n\s*\n/).forEach((b, i) => { const ls = b.trim().split("\n");
    if (i === 0 && ls.length === 1 && ls[0].length <= 40) return cards[0].push(`<h3 class="rt">${esc(ls[0])}</h3>`);
    if (ls.length > 1 && ls[0].length <= 40){ if (cards.at(-1).length) cards.push([]); return cards.at(-1).push(`<h4 class="rh">${esc(ls[0])}</h4><p>${esc(ls.slice(1).join("\n"))}</p>`) }
    cards.at(-1).push(`<p>${esc(b.trim())}</p>`) });
  const cs = cards.filter(c => c.length);
  return `<div class="rcards">${cs.map(c => `<div class="rcard voice report">${c.join("")}</div>`).join("")}</div>
    ${cs.length > 1 ? `<div class="rdots">${cs.map((_, i) => `<i aria-current="${!i}"></i>`).join("")}</div>` : ""}` };
// 넘길 때 아래 점을 따라 옮긴다
const bindCards = v => v.querySelectorAll(".rcards").forEach(r => { const dots = r.nextElementSibling?.classList.contains("rdots") ? [...r.nextElementSibling.children] : [];
  r.addEventListener("scroll", () => { const i = Math.round(r.scrollLeft / (r.firstElementChild.offsetWidth + 10)); dots.forEach((d, j) => d.setAttribute("aria-current", j === i)) }, { passive: true }) });
function reportHTML(kind){
  if (!reportOpen(kind)) return `<section style="margin-top:8px"><span class="small muted">${kind === "me"
    ? `? 탭의 질문에 다 답하면 나 리포트가 나와요 · ${baseCount(me)}/${baseList().length}`
    : `두 사람이 ? 탭의 질문에 다 답하면 리포트가 열려요 · 나 ${baseCount(me)}/${baseList().length} · ${esc(nameOf(other(me)))} ${baseCount(other(me))}/${baseList().length}`}</span></section>`;
  const key = { me: "self_" + me, other: "about_" + me, us: "us" }[kind], rp = S.meta[key], first = S.meta[{ me: "first_me_" + me, us: "first_us" }[kind]];
  if (ai && !aiState){
    const redo = all("asks").find(a => a.by === me && !a.done && a.aiq && S.aiq[a.aiq]?.ans && S.aiq[a.aiq].ats <= aiCut() && (a.ats || 0) < aiCut());
    if (redo) setTimeout(() => answerAsk(redo.id), 0);
  }
  const d = rp && new Date(rp.ts);
  const asks = all("asks").filter(a => a.by === me).sort((x, y) => y.ts - x.ts);
  return `<section style="margin-top:8px">
      ${first ? `<details${rp ? "" : " open"}><summary class="small muted" style="cursor:pointer">첫 리포트</summary>${reportBody(first.text)}</details>` : ""}
      ${rp ? `${reportBody(rp.text)}<span class="small muted">${d.getMonth() + 1}.${d.getDate()} ${hm(rp.ts)}</span>` : ""}
      ${ai ? `<button class="btn primary" id="rp-go" style="align-self:flex-start" ${aiState ? "disabled" : ""}>${aiState || (rp ? "다시 쓰기" : "리포트 쓰기")}</button>` : ""}
    </section>
    <section>
      <label class="inline"><input type="text" id="ask-in" placeholder="궁금한 것" aria-label="궁금한 것 물어보기"><button class="send" id="ask-send" aria-label="보내기">${svg("send")}</button></label>
      ${asks.map(a => `<div class="ask"><b>${esc(a.q)}</b>${a.a ? `<div class="voice" style="font-size:15.5px">${esc(a.a)}</div>` : `<span class="small muted">…</span>`}</div>`).join("")}
    </section>`;
}
function bindReport(v, kind){
  bindCards(v);
  v.querySelector("#rp-go")?.addEventListener("click", () => writeReport(kind));
  const send = () => { const i = v.querySelector("#ask-in"), q = i.value.trim(); if (!q) return i.focus();
    i.value = ""; i.blur(); const id = uid(); put("asks", id, { by: me, q, ts: Date.now() }); answerAsk(id) };
  v.querySelector("#ask-send")?.addEventListener("click", e => { e.preventDefault(); send() });
  v.querySelector("#ask-in")?.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) send() });
}
// 우리 탭: 나 · 상대 · 우리. 나·상대는 그 사람의 기분·에너지·속마음 비율(+ 나는 내 마음)과 리포트, 우리는 두 사람 기분·에너지를 겹쳐 그리고 리포트
VIEWS.stats = () => {
  const sub = route.sub || "me", o = other(me);
  const body = sub === "me" ? oneTrend(me, "smile", "☺", "기분") + oneTrend(me, "energy", "💊", "에너지") + compareHTML(me) + myLoveTrend()
    : sub === "other" ? oneTrend(o, "smile", "☺", "기분") + oneTrend(o, "energy", "💊", "에너지") + compareHTML(o)
    : bothTrend("smile", "☺", "기분") + bothTrend("energy", "💊", "에너지");
  return { title: "우리", html: `
    <div style="display:flex;justify-content:center"><div class="seg">${[["me", "나"], ["other", esc(nameOf(o))], ["us", "관계"]].map(([k, l]) =>
      `<button data-sub="${k}" aria-pressed="${sub === k}">${l}</button>`).join("")}</div></div>
    ${body}
    ${reportHTML(sub)}`,
  bind: v => { autoAI(); v.querySelectorAll("[data-sub]").forEach(b => b.onclick = () => { route.sub = b.dataset.sub; render(true) }); if (reportOpen(sub)) bindReport(v, sub) } };
};
// 속마음 비교 = 밖으로 말한 글자 수 대비 속마음 글자 수 (공백 제외)
//   밖으로 말한 것: 상황의 한마디
//   속마음: 상황의 속마음 글
const chars = s => [...String(s || "").replace(/\s/g, "")].length;
function speechCounts(w){
  let said = 0, inner = 0;
  all("posts").forEach(p => { if (p.who === w){ said += chars(p.text); inner += chars(p.secret) } });
  return { said, inner, ratio: said ? inner / said : null };
}
function compareHTML(only){
  const c = { a: speechCounts("a"), b: speechCounts("b") };
  const max = Math.max(1, c.a.said, c.a.inner, c.b.said, c.b.inner);
  const pct = n => (n / max * 72).toFixed(1); // 오른쪽에 글자 수 들어갈 자리를 남긴다
  const card = w => `<div class="card ratio" style="display:flex;flex-direction:column;gap:12px">
      <div class="post"><div class="head"><b class="who-${w}">${esc(nameOf(w))}</b></div></div>
      <div class="big"><b class="who-${w}">${c[w].ratio == null ? "–" : c[w].ratio.toFixed(2)}</b><span>배</span></div>
      <div class="bars">
        <div class="bar"><span>한마디</span><div class="track"><div class="fill said" style="width:${pct(c[w].said)}%"></div><span class="num">${c[w].said.toLocaleString()}자</span></div></div>
        <div class="bar"><span>속마음</span><div class="track"><div class="fill ${w}" style="width:${pct(c[w].inner)}%"></div><span class="num">${c[w].inner.toLocaleString()}자</span></div></div>
      </div></div>`;
  return only ? card(only) : card(me) + card(other(me));
}
const KINDS = [["couple", "연인"], ["friend", "친구"]];
VIEWS.settings = () => {
  const c = couple();
  draft.kind ??= c.kind;
  const ids = joinedList().sort((x, y) => (SP[x]?.ts || 0) - (SP[y]?.ts || 0));
  const spaceRow = id => {
    const sc = id === space ? c : { names: { a: "", b: "" }, kind: "couple", ...(SP[id] || {}) };
    return `<li><button data-space="${id}" aria-pressed="${id === space}" class="space-row">
      <span class="pair"><span class="who-a">${esc(sc.names.a)}</span> <span class="muted">&amp;</span> <span class="who-b">${esc(sc.names.b)}</span></span>
      <span class="tag ${sc.kind === "friend" ? "b" : "a"}">${sc.kind === "friend" ? "친구" : "연인"}</span>
      </button></li>`;
  };
  const seg = (key, val) => `<div class="seg">${KINDS.map(([k, l]) => `<button data-${key}="${k}" aria-pressed="${val === k}">${l}</button>`).join("")}</div>`;
  return { title: "설정", html: `
    <section><h3>지금 함께하는 사람</h3>
    <div class="card" style="display:flex;flex-direction:column;gap:14px">
      <div class="field"><span class="lab">관계</span>${seg("kind", draft.kind)}</div>
      <div class="field"><label class="lab" for="s-a">첫 번째 사람</label><input type="text" id="s-a" value="${esc(draft.na ?? c.names.a)}" style="color:var(--a)"></div>
      <div class="field"><label class="lab" for="s-b">두 번째 사람</label><input type="text" id="s-b" value="${esc(draft.nb ?? c.names.b)}" style="color:var(--b)"></div>
      <div class="field"><label class="lab" for="s-start">${draft.kind === "friend" ? "친구 된 날" : "사귄 날"} </label><input type="date" id="s-start" value="${esc(draft.start ?? c.start)}"></div>
      <button class="btn primary" id="s-save">저장</button>
    </div>
    <div class="field"><span class="lab">내 색</span>${swatches(c.colors?.[me], c.colors?.[other(me)])}</div>
    <div class="field"><span class="lab">코드</span><span style="font-variant-numeric:tabular-nums;letter-spacing:.15em">${space}</span></div>
    </section>
    <section><h3>사람 바꾸기</h3>
      <ul class="qlist card">${ids.map(spaceRow).join("")}</ul>
      <button class="btn" id="n-add">${svg("plus")} 새 연결</button>
      ${pushHTML()}
      <button class="textbtn" id="leave" style="align-self:flex-start">이 기기에서 나가기</button>
      ${logoutHTML()}
    </section>`,
  bind: v => {
    const keep = () => { draft.na = v.querySelector("#s-a").value; draft.nb = v.querySelector("#s-b").value; draft.start = v.querySelector("#s-start").value };
    v.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { keep(); draft.kind = b.dataset.kind; render(true) });
    v.querySelector("#s-save").onclick = () => {
      putSpace(space, { ...(SP[space] || {}), names: { a: v.querySelector("#s-a").value.trim() || "A", b: v.querySelector("#s-b").value.trim() || "B" },
        start: v.querySelector("#s-start").value, kind: draft.kind });
      draft = {}; toast("저장");
    };
    v.querySelectorAll("[data-space]").forEach(b => b.onclick = () => { if (b.dataset.space !== space) { switchSpace(b.dataset.space); toast("변경") } });
    v.querySelector("#n-add").onclick = () => go("pair", { backTo: "settings" });
    // 이 기기에서만 연결을 내려놓는다 (기록과 자리는 그대로, 같은 계정으로 다시 들어올 수 있다)
    const lv = v.querySelector("#leave");
    lv.onclick = () => {
      if (!lv.dataset.armed){ lv.dataset.armed = 1; lv.textContent = "한 번 더 누르면 나가요"; lv.classList.add("danger"); return }
      lsSet("hito.joined", JSON.stringify(joinedList().filter(id => id !== space)));
      try { localStorage.removeItem("hito.space") } catch {}
      space = null; me = null; subscribeSpace(); COLS.forEach(c => S[c] = {}); go("home");
    };
    bindPush(v);
    bindLogout(v);
    v.querySelectorAll("[data-color]").forEach(b => b.onclick = () => { keep();
      putSpace(space, { ...SP[space], colors: { ...(SP[space]?.colors || {}), [me]: b.dataset.color } }) });
  }};
};

loadLocal();
render(true);
connect();
myIdReady.then(() => render());
</script>

</body></html>
